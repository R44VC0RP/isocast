name: Migrate secrets

# Temporary: copies the environment secrets into AWS Secrets Manager
# (isocast/<stage>/<NAME>), then is deleted in the same commit that rewires
# the workflows to read them from there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/isocast-release
          aws-region: us-east-1
      - name: Copy the release secrets
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CAMERA_PROVISIONING_PROFILE_B64: ${{ secrets.CAMERA_PROVISIONING_PROFILE_B64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ENGINE_PROVISIONING_PROFILE_B64: ${{ secrets.ENGINE_PROVISIONING_PROFILE_B64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          put() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "::error::$name is empty"; exit 1; fi
            aws secretsmanager put-secret-value --secret-id "isocast/release/$name" --secret-string "$value" > /dev/null
            echo "$name copied"
          }
          put APPLE_API_ISSUER_ID "$APPLE_API_ISSUER_ID"
          put APPLE_API_KEY_ID "$APPLE_API_KEY_ID"
          put APPLE_API_KEY_P8_BASE64 "$APPLE_API_KEY_P8_BASE64"
          put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          put CAMERA_PROVISIONING_PROFILE_B64 "$CAMERA_PROVISIONING_PROFILE_B64"
          put DEVELOPER_ID_P12_BASE64 "$DEVELOPER_ID_P12_BASE64"
          put DEVELOPER_ID_P12_PASSWORD "$DEVELOPER_ID_P12_PASSWORD"
          put ENGINE_PROVISIONING_PROFILE_B64 "$ENGINE_PROVISIONING_PROFILE_B64"
          put SPARKLE_ED_PRIVATE_KEY "$SPARKLE_ED_PRIVATE_KEY"

  visual-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: visual-judge
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/isocast-visual-judge
          aws-region: us-east-1
      - name: Copy the visual-judge secrets
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          put() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "::error::$name is empty"; exit 1; fi
            aws secretsmanager put-secret-value --secret-id "isocast/visual-judge/$name" --secret-string "$value" > /dev/null
            echo "$name copied"
          }
          put OPENCODE_API_KEY "$OPENCODE_API_KEY"
