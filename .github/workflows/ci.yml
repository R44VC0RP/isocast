name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test (macOS arm64)
    # GitHub-hosted only: pull requests from forks must never run on our own
    # machines, so no self-hosted runners here.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: PR description checks (unit tests)
        run: python3 .github/scripts/pr_checks_test.py

      - name: Third-party notices up to date
        run: scripts/third-party-notices.sh --check

      - name: CLI, setup and MCP references up to date
        run: |
          cargo build --locked -p isocast-cli
          python3 scripts/reference-docs.py target/debug/isocast --check

  motion:
    # The motion harness (docs/motion-testing.md): the real interface drawn
    # offscreen, scripted drags replayed on a virtual clock, every frame
    # checked. Lockstep runs draw the same pixels on any machine, so this
    # is a pass/fail gate, not a benchmark: the harness's controls must
    # come out as expected, and the standard suite must match its baseline
    # of known issues exactly (scripts/motion/suite.toml).
    name: motion suite (headless, macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests: only when the interface or the harness changed (the
      # job still reports success otherwise, so it can be required).
      # Pushes to main and manual runs: always.
      - name: Interface changed?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            if [ -z "$(git diff --name-only "$base" "$HEAD_SHA" -- crates/isocast-ui/ scripts/motion.sh scripts/motion/ .github/workflows/ci.yml)" ]; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "motion suite: run=$run"

      - name: Rust toolchain
        if: steps.changes.outputs.run == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cargo cache
        if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        if: steps.changes.outputs.run == 'true'
        run: cargo build --locked --release -p isocast-ui -p isocast-daemon -p isocast-cli

      - name: Harness controls
        if: steps.changes.outputs.run == 'true'
        run: scripts/motion.sh --suite scripts/motion/controls.toml --no-timing --out "$RUNNER_TEMP/motion/controls"

      - name: Standard suite (lockstep)
        if: steps.changes.outputs.run == 'true'
        run: scripts/motion.sh --clock lockstep --no-timing --out "$RUNNER_TEMP/motion/suite"

      - name: Upload results
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: motion-results
          path: ${{ runner.temp }}/motion
          if-no-files-found: ignore
          retention-days: 14
