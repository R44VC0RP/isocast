name: Windows
on:
  push:
    branches: [ci/win-dxc-ab]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  win-release:
    # Host-specific recording qualification uses optimized services, not the
    # debug binaries of the build job; built here in parallel with it.
    name: Windows release qualification (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MODE: 'full'
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Every step that can compile the UI, including Clippy/tests and the
      # second installer, must keep this setting or restore the large module.
      ISOCAST_UI_NO_GALLERY: '1'
      # Qualification artifacts only, never release builds. The private half
      # stays in the packaging lane's isolated VM-host folder, not GitHub.
      ISOCAST_WINDOWS_UPDATE_TEST: '1'
      ISOCAST_WINDOWS_UPDATE_KEY: '8mHwrJ82GhszmY2GnbKhW/qJsDL0XEYReeB5AsIT1Z0='
      ISOCAST_WINDOWS_APPCAST_URL: 'http://127.0.0.1:17745/appcast-windows-test.xml'
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: cache
        with:
          key: windows-release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Qualification build identity
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          export ISOCAST_WINDOWS_BUILD_VERSION="$version.1"
          echo "ISOCAST_WINDOWS_BASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ISOCAST_WINDOWS_BUILD_VERSION=$ISOCAST_WINDOWS_BUILD_VERSION" >> "$GITHUB_ENV"

      # Host-specific recording qualification uses optimized services, not the debug
      # binaries used for recovery/contract checks above.
      - name: Build recording qualification services
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked -j 2 -p isocast-daemon -p isocast-cli -p isocast-platform-windows -p isocast-browser --features isocast-daemon/vcam-diagnostics --bins --example monitor-loopback --example vcam-reader

      - name: Install recording recovery decoder
        if: env.MODE == 'full'
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg' }
          }
          ffmpeg -version
          ffprobe -version

      # Hosted WARP checks compiler selection and exact program pictures, not
      # five-output capacity. Keep win_record and win_scenes strict for hardware.
      - name: Verify the packaged FXC path records an exact program cut
        if: env.MODE == 'full'
        shell: pwsh
        run: |
          ./scripts/windows/stage-dxc.ps1 -Destination target/release -ToolsDir "$env:RUNNER_TEMP/dxc-tools"
          python scripts/e2e.py --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_program_cut --codec h264 --windows-profile 180p30 --work "$env:RUNNER_TEMP/windows-dxc" --keep --report windows-dxc.json
          $code = $LASTEXITCODE
          $report = Get-Content -Raw windows-dxc.json | ConvertFrom-Json
          $log = @(Get-ChildItem -Path "$($report.work)/win_program_cut/d.logs/*.jsonl" | Select-String -SimpleMatch 'DX12 shader compiler:')
          $log | ForEach-Object { Write-Host $_.Line }
          if ($log.Count -ne 1 -or $log[0].Line -notlike '*DX12 shader compiler: FXC (default)*') { throw 'win_program_cut did not stay on FXC during warm-up' }
          if ($code -ne 0 -or $report.totals.PASS -ne 1) { throw 'Strict program cut failed; see scenario result above' }
          $proof = $report.scenarios[0].evidence
          $writer = $proof.drops.psobject.Properties.Value
          Write-Host "Verified $($proof.oracle[0].checks)/$($writer.slots) exact picture IDs; cut to bars2 at slot $($proof.cut_slot); drops=$($writer.dropped), repeats=$($writer.repeated), audio dropouts=$($writer.audio_dropouts)."

      - name: Save measured recording report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-program-cut
          path: windows-dxc.json
          if-no-files-found: error
          retention-days: 7
