name: Windows

on:
  schedule:
    - cron: '27 5 * * 1'
  workflow_call:
    inputs:
      linux_release_commit:
        description: 'Build and install-test only the Linux packages at this release commit'
        type: string
        required: true
  push:
    # ci/<lane>: candidates published by scripts/ci.sh before they merge.
    # main: catches a break that merged anyway, and saves the Rust caches
    # every lane restores (GitHub scopes caches to a branch, and only the
    # default branch's are readable from every other one).
    branches: [main, 'ci/**']

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.linux_release_commit || github.ref }}
  # Per branch, so lanes never cancel each other; a lane's newer candidate
  # cancels its older run, main's never.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Decides which jobs this change needs (.github/scripts/ci_gate.py): by
  # the paths that changed, and not at all when the same tree already
  # passed CI, Engine E2E and Windows. Its summary says why each job runs.
  gate:
    name: what to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      portable: ${{ steps.gate.outputs.portable }}
      linux: ${{ steps.gate.outputs.linux }}
      linux_capture: ${{ steps.gate.outputs.linux_capture }}
      linux_app: ${{ steps.gate.outputs.linux_app }}
      linux_distro: ${{ steps.gate.outputs.linux_distro }}
      deb: ${{ steps.gate.outputs.deb }}
      win_build: ${{ steps.gate.outputs.win_build }}
      win_release: ${{ steps.gate.outputs.win_release }}
      win_recovery: ${{ steps.gate.outputs.win_recovery }}
      win_wording: ${{ steps.gate.outputs.win_wording }}
      win_package: ${{ steps.gate.outputs.win_package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.linux_release_commit }}
        run: |
          if [[ -n "$RELEASE_COMMIT" ]]; then
            [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            for job in portable linux linux_capture linux_distro win_build win_release win_recovery win_wording win_package; do
              echo "$job=skip" >> "$GITHUB_OUTPUT"
            done
            printf 'linux_app=full\ndeb=full\n' >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/ci_gate.py windows
          fi

  linux-distro:
    name: Linux distro (${{ matrix.distro }}, x86_64)
    needs: gate
    if: needs.gate.outputs.linux_distro != 'skip'
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.distro }}:latest
      volumes:
        - /usr/local/lib/android/sdk:/runner-android-sdk
    # Allow a cold toolchain/dependency cache; warm builds target 20 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [archlinux, fedora]
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      LP_NUM_THREADS: 2
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
    steps:
      - name: Reclaim unused hosted runner Android SDK
        run: |
          df -h .
          # The build shares the host disk. Remove only the mounted SDK's contents.
          find /runner-android-sdk -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          df -h .
      - name: Arch packaging tools and test dependencies
        if: matrix.distro == 'archlinux'
        run: |
          pacman -Syu --noconfirm --needed base-devel rust git vulkan-swrast ffmpeg python zstd
          df -h .
      - name: Fedora packaging tools and test dependencies
        if: matrix.distro == 'fedora'
        run: |
          dnf --disablerepo='*cisco*' install -y rpm-build dnf5-plugins git python3 tar gzip zstd patch \
            gstreamer1-plugins-good gstreamer1-plugin-libav mesa-vulkan-drivers noopenh264 ffmpeg-free
          df -h .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve build dependencies from the package recipe
        run: |
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ '${{ matrix.distro }}' == archlinux ]]; then
            useradd -m builder
            cd /home/builder
            cp "$GITHUB_WORKSPACE/packaging/arch/PKGBUILD" .
            # Seed makepkg's source cache from the exact candidate, not upstream HEAD.
            git clone --mirror "$GITHUB_WORKSPACE" isocast
            git -C isocast remote set-url origin https://github.com/anomalyco/isocast.git
            chown -R builder:builder /home/builder
            runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
            mapfile -t deps < <(awk '$1 == "depends" || $1 == "makedepends" {print $3}' .SRCINFO)
            pacman -S --needed --noconfirm "${deps[@]}"
          else
            dnf --disablerepo='*cisco*' builddep -y packaging/rpm/isocast.spec
          fi
          rustc -Vv
          df -h .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: distro-${{ matrix.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native package
        id: build
        run: |
          export CARGO_TARGET_DIR="$PWD/target"
          df -h "$GITHUB_WORKSPACE"
          mkdir -p dist "$CARGO_TARGET_DIR"
          if [[ '${{ matrix.distro }}' == archlinux ]]; then
            chown -R builder:builder "$CARGO_TARGET_DIR"
            cd /home/builder
            runuser -u builder -- makepkg --holdver --noconfirm
            cp isocast-git-*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
          else
            CARGO_BUILD_JOBS=2 ISOCAST_UI_NO_GALLERY=1 scripts/package-rpm.sh
          fi
          df -h "$GITHUB_WORKSPACE"
      # Container actions run in fresh sibling containers. Only the workspace
      # is shared; neither build packages nor Cargo are on the runtime PATH.
      - name: Install and record on clean Arch
        if: matrix.distro == 'archlinux'
        uses: docker://archlinux:latest
        with:
          entrypoint: bash
          args: scripts/linux-distro-installed.sh archlinux
      - name: Install and record on clean Fedora
        if: matrix.distro == 'fedora'
        uses: docker://fedora:latest
        with:
          entrypoint: bash
          args: scripts/linux-distro-installed.sh fedora
      - name: Fedora Workstation codecs and fixture tools
        id: codecs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.distro == 'fedora' }}
        run: |
          # The smoke above intentionally uses the stock stub. Test real encodes below.
          df -h .
          dnf --enablerepo=fedora-cisco-openh264 swap -y noopenh264 openh264
          dnf --enablerepo=fedora-cisco-openh264 install -y gstreamer1-plugin-openh264
          # RPM Fusion FFmpeg supplies libx264 for generating the unit-test fixtures;
          # it is not an Isocast build or runtime dependency.
          dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf swap -y --allowerasing ffmpeg-free ffmpeg
          rpm -q openh264 gstreamer1-plugin-openh264 gstreamer1-plugin-libav ffmpeg
      - name: Linux platform unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (matrix.distro == 'archlinux' || steps.codecs.outcome == 'success') }}
        run: |
          df -h .
          cargo test --release --locked -p isocast-platform-linux --lib
      - name: Final runner disk space
        if: always()
        run: df -h .

  portable:
    name: portable (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.portable != 'skip'
    strategy:
      # Keep both platforms' diagnostics when one fails.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ needs.gate.outputs.portable }}
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: cache
        with:
          key: windows-portable
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: env.MODE == 'full'
        run: cargo fmt --all --check

      # W.0 is the OS-independent foundation, not a runnable Windows recorder.
      # Native service builds live below; recording qualification needs W.2+.
      - name: Build portable crates
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        id: build
        run: cargo build --locked -p isocast-protocol -p isocast-diagnostics -p isocast-obsws -p isocast-mux

      - name: Clippy portable crates
        if: env.MODE == 'full'
        run: cargo clippy --locked --keep-going --all-targets -p isocast-protocol -p isocast-diagnostics -p isocast-obsws -p isocast-mux -- -D warnings

      - name: Test portable crates
        if: (!cancelled() && steps.build.outcome == 'success') && (env.MODE == 'full')
        run: cargo test --locked --no-fail-fast -p isocast-protocol -p isocast-diagnostics -p isocast-obsws -p isocast-mux

      - name: Protect adjacent release assets (no GitHub calls)
        if: (matrix.os == 'ubuntu-latest') && (env.MODE == 'full')
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("release", "scripts/release-finalize.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          mac = {"Isocast-1.2.3-arm64.dmg", "Isocast-1.2.3-arm64.dmg.sha256", "appcast.xml"}
          windows = release.windows_asset_names("1.2.3")
          linux = {"SHA256SUMS", *release.linux_packages("1.2.3")}
          current = {}
          def read_only(*args, **kwargs):
              assert args[:2] == ("gh", "api") and "--method" not in args
              return json.dumps(current)
          release.command = read_only
          for names, accepted in [(mac, True), (mac | windows, True),
                                  (mac | linux, True), (mac | linux | windows, True),
                                  (mac | (linux - {"SHA256SUMS"}), False),
                                  (mac | {"SHA256SUMS"}, False),
                                  (mac | {"appcast-windows.xml"}, False),
                                  (mac | windows | {"unexpected.exe"}, False)]:
              current = {"tag_name": "v1.2.3", "draft": False,
                         "assets": [{"name": name} for name in names]}
              try:
                  _, assets = release.published_release("v1.2.3", mac, allow_windows=True)
              except ValueError:
                  assert not accepted
              else:
                  assert accepted and set(assets) == names
          def forbidden(*args, **kwargs):
              raise AssertionError("draft replacement must stop before signing or writing")
          release.command = forbidden
          release.appcast = forbidden
          release.release_notes = lambda version: "Qualification notes"
          release.all_releases = lambda: [{"tag_name": "v1.2.3", "draft": True,
                                          "assets": [{"name": name} for name in mac | windows]}]
          try:
              release.draft_release(Path("unused"), {"version": "1.2.3"}, [], replace=True)
          except ValueError as error:
              assert "Windows assets" in str(error)
          else:
              raise AssertionError("Mac-only replacement accepted a Windows draft")
          print("Mac-only/full Windows sets accepted; partial/unknown sets and destructive replacement refused")
          PY

  linux:
    name: headless Linux daemon (ubuntu-latest)
    needs: gate
    if: needs.gate.outputs.linux != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODE: ${{ needs.gate.outputs.linux }}
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
      # The OpenH264 load test fails, not skips, without the library.
      ISOCAST_OPENH264_REQUIRED: 1
      # libxaac-sys 0.1 invokes CMake without CMAKE_BUILD_TYPE or Cargo's
      # optimization level, even in release builds. Optimize native AAC too.
      CFLAGS: -O2
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Linux build and software Vulkan dependencies
        timeout-minutes: 20
        run: |
          # Ubuntu 24.04's PipeWire 1.0.5 supplies pw_buffer.time; this also installs libspa-0.2-dev.
          .github/scripts/apt-install.sh build-essential pkg-config libssl-dev libvulkan1 mesa-vulkan-drivers ffmpeg nasm cmake clang libclang-dev avahi-daemon dbus libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          sudo systemctl start avahi-daemon
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          key: linux-server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon and CLI
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ "$MODE" = full ]; then
            # A separate fixture binary with immutable provenance. No runtime
            # switch in the shipping daemon can impersonate another build.
            ISOCAST_BUILD_COMMIT=e2e-older-commit cargo build --release --locked -p isocast-daemon -p isocast-cli
            cp target/release/isocastd "$RUNNER_TEMP/isocastd-old"
            cp target/release/isocast "$RUNNER_TEMP/isocast-old"
          fi
          cargo build --release --locked -p isocast-daemon -p isocast-cli

      - name: Daemon queries do not start an engine
        if: env.MODE == 'full'
        run: |
          home=$(mktemp -d)
          probe() {
            env -i HOME="$home" PATH="$PATH" XDG_RUNTIME_DIR="$home" \
              ISOCAST_SOCKET="$home/engine.sock" ISOCAST_LOG_DIR="$home/logs" \
              timeout -k 1 5 target/release/isocastd "$@"
          }
          version=$(probe --build-identity | jq -er .version)
          for flag in --version -V; do
            test "$(probe "$flag")" = "isocastd $version"
          done
          help=$(probe --help)
          test "$(probe -h)" = "$help"
          grep -Fq -- '--exit-on-stdin-close' <<< "$help"
          for flag in '' --version --exit-on-stdin-close; do
            code=0
            probe ${flag:+"$flag"} --bogus >"$RUNNER_TEMP/options.out" 2>"$RUNNER_TEMP/options.err" || code=$?
            test "$code" = 2
            test ! -s "$RUNNER_TEMP/options.out"
            test "$(tail -n +2 "$RUNNER_TEMP/options.err")" = "$help"
          done
          rmdir "$home"  # fails even for a single hidden file or socket

      # Cisco's OpenH264 binary, as install.sh downloads it (pinned version
      # and SHA-256; Isocast compiles none): the encoder and decoder tests
      # and the e2e load it from ~/.local/lib/isocast.
      - name: Cache Cisco's OpenH264
        if: env.MODE == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/lib/isocast/libopenh264-2.6.0-*.so
          key: openh264-2.6.0-${{ runner.arch }}

      - name: Cisco's OpenH264
        if: env.MODE == 'full'
        run: packaging/linux/install.sh --openh264

      - name: Linux platform checks
        if: env.MODE == 'full'
        run: |
          cargo clippy --release --locked --all-targets -p isocast-openh264 -p isocast-platform-linux -p isocast-platform-credentials -p isocast-daemon -- -D warnings
          cargo test --release --locked -p isocast-openh264 -p isocast-platform-linux -p isocast-platform-credentials
          # The client's own tests on Linux too (the daemon's local and remote transports).
          cargo test --release --locked -p isocast-client
          cargo test --release --locked -p isocast-discovery
          GST_PLUGIN_FEATURE_RANK=avdec_h264:NONE,openh264dec:NONE,v4l2h264dec:NONE,vah264dec:NONE cargo test --release --locked -p isocast-platform-linux missing_h264_decoder -- --ignored
          cargo test --release --locked -p isocast-discovery avahi_advertise_browse_collision_and_withdraw -- --ignored --test-threads=1

      # Four hosted vCPUs saturate on three 720p software encodes plus
      # lavapipe. Use the existing hosted policy for this integrity smoke;
      # the six-vCPU arm64 VM separately qualifies strict 720p30 zero drops.
      - name: Synthetic program, ISOs, a media file and a stream (hosted 360p30)
        if: env.MODE == 'full'
        run: ISOCAST_E2E_OLD_DAEMON="$RUNNER_TEMP/isocastd-old" python3 scripts/e2e.py --hosted --only linux_record --only linux_recovery --only linux_handoff --only linux_media --only linux_shared_frames --only stream --linux-profile 360p30 --codec h264 --work "$RUNNER_TEMP/linux-e2e" --keep-failures --report linux-e2e.json

      - name: E2E summary
        if: (always()) && (env.MODE == 'full')
        run: |
          if test -f linux-e2e.json; then
            python3 scripts/e2e.py --summary linux-e2e.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Linux recording evidence
        if: (always()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-e2e
          path: |
            linux-e2e.json
            ${{ runner.temp }}/linux-e2e
          retention-days: 7

  linux-capture:
    # The real Linux capture paths, on a headless desktop with no prompts
    # (scripts/linux-capture-fixture.sh): the screen through the ScreenCast
    # portal (sway, xdg-desktop-portal-wlr) over PipeWire, desktop audio from
    # PipeWire's default sink, a virtual microphone and, where the runner's
    # kernel takes v4l2loopback, a V4L2 camera. e2e.py linux_capture records
    # them at 480x270p30 for 15 s and checks every file decodes, each track
    # carries its own tone (440 Hz desktop, 880 Hz mic) and not the other, the
    # pictures are the clips' moving frame codes, and no file dropped a frame
    # or audio (zero, also under --hosted).
    name: Linux capture (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.linux_capture != 'skip'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      MODE: ${{ needs.gate.outputs.linux_capture }}
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
      CFLAGS: -O2
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Build and fixture dependencies
        timeout-minutes: 45
        env:
          ISOCAST_APT_INSTALL: .github/scripts/apt-install.sh
        run: |
          echo "FIXTURE=$RUNNER_TEMP/linux-capture-fixture" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          # GStreamer builds and runs media sources; WebKitGTK 6 and GTK 4
          # build the browser helper (libgtk-4-bin has gtk4-broadwayd, its
          # private display).
          # Exercise fallback on both real runner images when the helper changes.
          if ! git diff --quiet HEAD^ HEAD -- .github/scripts/apt-install.sh; then
            export APT_FORCE_FIRST_DOWNLOAD_FAILURE=1
          fi
          .github/scripts/apt-install.sh build-essential pkg-config libssl-dev libvulkan1 mesa-vulkan-drivers ffmpeg nasm cmake clang libclang-dev dbus libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libwebkitgtk-6.0-dev libgtk-4-dev libgtk-4-bin
          unset APT_FORCE_FIRST_DOWNLOAD_FAILURE
          scripts/linux-capture-fixture.sh deps
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The patched portal backend, built once per fixture script version.
      - if: env.MODE == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-capture-fixture/portal
          # The portal binary links the image's libpipewire and libwayland.
          key: linux-capture-portal-${{ matrix.arch }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('scripts/linux-capture-fixture.sh') }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          key: linux-capture-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon, CLI and browser helper
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: cargo build --release --locked -p isocast-daemon -p isocast-cli -p isocast-browser

      # Cisco's OpenH264 (the recordings encode H.264 with it).
      - name: Cache Cisco's OpenH264
        if: env.MODE == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/lib/isocast/libopenh264-2.6.0-*.so
          key: openh264-2.6.0-${{ runner.arch }}

      - name: Cisco's OpenH264
        if: env.MODE == 'full'
        run: packaging/linux/install.sh --openh264

      - name: Start the headless desktop (portal, PipeWire, virtual devices)
        if: env.MODE == 'full'
        timeout-minutes: 10
        run: scripts/linux-capture-fixture.sh start "$FIXTURE" 640x360

      - name: Capture a DMA-BUF-only source pixel-exactly
        if: env.MODE == 'full'
        timeout-minutes: 15
        run: |
          . "$FIXTURE/session.env"
          scripts/linux-capture-fixture.sh dmabuf "$FIXTURE"

      - name: PipeWire callbacks run on the worker thread
        if: env.MODE == 'full'
        timeout-minutes: 15
        run: |
          . "$FIXTURE/session.env"
          cargo test --release --locked -p isocast-platform-linux stream_callbacks_run_on_the_worker_thread -- --ignored

      - name: Record screen, desktop audio, microphone, camera, a media file and a browser source (hosted rules)
        if: env.MODE == 'full'
        timeout-minutes: 20
        run: |
          . "$FIXTURE/session.env"
          python3 scripts/e2e.py --hosted --only linux_capture --only linux_audio_exclude --only linux_media --only linux_browser --only browser_audio_gap --linux-profile 360p30 --codec h264 \
            --work "$RUNNER_TEMP/linux-capture" --keep-failures --report linux-capture.json
          # A skipped scenario would pass silently: all five must have run.
          python3 - <<'PY'
          import json
          r = {s["name"]: s for s in json.load(open("linux-capture.json"))["scenarios"]}
          assert r["linux_audio_exclude"]["status"] == "PASS", r["linux_audio_exclude"].get("reason")
          m = r.get("linux_media")
          assert m and m["status"] == "PASS", f"linux_media did not pass: {m and (m['status'], m.get('reason'))}"
          b = r.get("linux_browser")
          assert b and b["status"] == "PASS", f"linux_browser did not pass: {b and (b['status'], b.get('reason'))}"
          print("browser:", {k: b["evidence"].get(k) for k in ("web_codes", "program_codes", "alpha", "tones", "writer_drops")})
          gap = r.get("browser_audio_gap")
          assert gap and gap["status"] == "PASS", f"browser_audio_gap did not pass: {gap and (gap['status'], gap.get('reason'))}"
          print("browser_audio_gap:", {k: gap["evidence"][k] for k in ("live_dropouts", "stopped_dropouts", "manifest_dropouts")})
          s = r.get("linux_capture")
          assert s and s["status"] == "PASS", f"linux_capture did not pass: {s and (s['status'], s.get('reason'))}"
          ev = s["evidence"]
          print("camera:", ev.get("camera"))
          if "skip" in str(ev.get("camera")).lower():
              print(f"::warning::linux_capture: camera skipped: {ev.get('camera')}")
          print("app audio:", ev.get("app_audio"))
          print("writer drops:", ev.get("writer_drops"))
          PY

      - name: E2E summary
        if: (always()) && (env.MODE == 'full')
        run: |
          if test -f linux-capture.json; then
            python3 scripts/e2e.py --summary linux-capture.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the desktop
        if: (always()) && (env.MODE == 'full')
        timeout-minutes: 2
        run: scripts/linux-capture-fixture.sh stop "$FIXTURE" || true

      - name: Capture evidence and fixture logs
        if: (always()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-capture-${{ matrix.arch }}
          path: |
            linux-capture.json
            ${{ runner.temp }}/linux-capture
            ${{ runner.temp }}/linux-capture-fixture/logs
            ${{ runner.temp }}/linux-capture-fixture/session.env
          retention-days: 7

  linux-app:
    # The Ubuntu desktop app against a local engine: x86_64 and arm64. Rendering runs on
    # Mesa's software Vulkan here; a snapshot proves the window draws.
    name: Linux app (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.linux_app != 'skip'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: these binaries become the ~ubuntu24.04 .debs (deb-ubuntu),
          # whose Depends dpkg-shlibdeps reads on ubuntu-24.04.
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      MODE: ${{ needs.gate.outputs.linux_app }}
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
      # The OpenH264 load test fails, not skips, without the library.
      ISOCAST_OPENH264_REQUIRED: 1
      CFLAGS: -O2
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.linux_release_commit || github.sha }}
          persist-credentials: false

      - name: Linux build dependencies
        timeout-minutes: 20
        run: |
          .github/scripts/apt-install.sh build-essential pkg-config libssl-dev libvulkan1 mesa-vulkan-drivers nasm cmake clang libclang-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libpipewire-0.3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkitgtk-6.0-dev libgtk-4-dev
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        id: cache
        with:
          key: linux-app-${{ matrix.arch }}
          save-if: ${{ !inputs.linux_release_commit && github.ref == 'refs/heads/main' }}

      # Cisco's OpenH264 binary, as install.sh downloads it (pinned version
      # and SHA-256; Isocast compiles none): the encoder and decoder tests
      # and the e2e load it from ~/.local/lib/isocast.
      - name: Cache Cisco's OpenH264
        if: env.MODE == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/lib/isocast/libopenh264-2.6.0-*.so
          key: openh264-2.6.0-${{ runner.arch }}

      - name: Cisco's OpenH264
        if: env.MODE == 'full'
        run: packaging/linux/install.sh --openh264

      - name: Verify OpenH264 lookup and ELF sonames
        if: env.MODE == 'full'
        run: cargo test --release --locked -p isocast-openh264 -- --include-ignored

      - name: Build app, engine, CLI and browser helper
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p isocast-ui -p isocast-daemon -p isocast-cli -p isocast-browser

      - name: App checks
        if: env.MODE == 'full'
        run: |
          cargo clippy --release --locked --all-targets -p isocast-ui -p isocast-protocol -p isocast-diagnostics -p isocast-browser -- -D warnings
          cargo test --release --locked -p isocast-ui -p isocast-protocol -p isocast-diagnostics -p isocast-browser

      - name: X11 screen and window capture without a portal
        if: env.MODE == 'full'
        run: |
          # winit loads the X11 keyboard library at runtime; libxkbcommon-dev
          # alone does not install it. The shipped .deb already depends on it.
          .github/scripts/apt-install.sh xvfb xauth xdotool ffmpeg libxkbcommon-x11-0
          bash scripts/linux-x11-capture-check.sh

      - name: Offscreen snapshot against a local engine
        if: env.MODE == 'full'
        run: |
          work="$RUNNER_TEMP/linux-app"
          mkdir -p "$work"
          export ISOCAST_SOCKET="$work/engine.sock" ISOCAST_SETUP="$work/setup.toml" ISOCAST_CALIBRATION=off
          target/release/isocast apply --revision 0 packaging/linux/test-setup.toml
          target/release/isocast-ui --snapshot "$work/main.png" --size 1280x800 --wait-ms 3000
          target/release/isocast-ui --snapshot "$work/settings.png" --size 1280x800 --state settings:output
          # Filters shows its source live and through its filters: the
          # setup's white "tint" square, tinted magenta, fills the dialog's
          # picture (the program shows it only as a small corner).
          target/release/isocast-ui --snapshot "$work/filters.png" --size 1280x800 --state dialog:filters:tint --state wait:3000
          python3 - "$work/filters.png" <<'PY'
          import struct, sys, zlib
          data = open(sys.argv[1], "rb").read()
          width, height, depth, kind = struct.unpack(">IIBB", data[16:26])
          assert (depth, kind) == (8, 6), "expected an 8-bit RGBA PNG"
          at, idat = 8, b""
          while at < len(data):
              size, name = struct.unpack(">I4s", data[at:at + 8])
              if name == b"IDAT":
                  idat += data[at + 8:at + 8 + size]
              at += size + 12
          raw, stride, rows, prev = zlib.decompress(idat), width * 4, [], bytearray(width * 4)
          for y in range(height):
              f, line = raw[y * (stride + 1)], bytearray(raw[y * (stride + 1) + 1:(y + 1) * (stride + 1)])
              for i in range(stride):
                  a, b, c = line[i - 4] if i >= 4 else 0, prev[i], prev[i - 4] if i >= 4 else 0
                  p = a + b - c
                  pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                  line[i] = (line[i] + (0, a, b, (a + b) // 2, a if pa <= pb and pa <= pc else b if pb <= pc else c)[f]) & 255
              rows.append(line)
              prev = line
          tinted = sum(1 for line in rows for x in range(0, stride, 4) if line[x] > 200 and line[x + 1] < 60 and line[x + 2] > 200)
          white = sum(1 for line in rows for x in range(0, stride, 4) if min(line[x:x + 3]) > 235)
          print(f"filters.png: {tinted} magenta (filtered) pixels, {white} white")
          assert tinted > 20000, "the Filters preview doesn't show its source filtered"
          PY
          target/release/isocast engine shutdown || true

      - name: Stage Ubuntu binaries for dpkg-shlibdeps and pre-strip codec checks
        if: env.MODE == 'full'
        run: tar -C target/release -cf ubuntu-binaries.tar isocast isocastd isocast-ui isocast-browser

      - name: Upload Ubuntu package inputs
        if: env.MODE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-binaries-${{ matrix.arch }}
          path: ubuntu-binaries.tar
          retention-days: 1

      - name: Upload snapshots
        if: (always()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-app-snapshots-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-app/*.png
          retention-days: 7

  deb-ubuntu:
    # Ubuntu 24.04 .debs from the full Ubuntu binaries (linux-app):
    # Depends from dpkg-shlibdeps here, lintian with no errors.
    name: .deb Ubuntu 24.04 (${{ matrix.arch }})
    needs: [gate, linux-app]
    if: needs.gate.outputs.deb != 'skip'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MODE: ${{ needs.gate.outputs.deb }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything. (deb is in
        # NO_CACHE, so it is never warm.)
        run: |
          case "$MODE" in
            full) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.linux_release_commit || github.sha }}
          persist-credentials: false

      - name: Packaging tools
        timeout-minutes: 20
        run: |
          # dpkg-shlibdeps reads the libraries the binaries link, so they
          # must be installed (a stock runner has all but PipeWire's, and
          # GStreamer's, and WebKitGTK 6 and GTK 4 for the browser helper).
          .github/scripts/apt-install.sh dpkg-dev lintian binutils libpipewire-0.3-0t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libglib2.0-0t64 libwebkitgtk-6.0-4 libgtk-4-1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-binaries-${{ matrix.arch }}
          path: dist

      - name: Package
        run: |
          tar -C dist -xf dist/ubuntu-binaries.tar
          scripts/package-deb.sh dist ubuntu24.04
          dpkg-deb --info dist/isocast_*.deb
          dpkg-deb --contents dist/isocast_*.deb

      - name: lintian
        run: lintian --fail-on error --display-info dist/isocast_*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isocast-deb-ubuntu24.04-${{ matrix.arch }}
          path: dist/isocast_*.deb
          retention-days: 30

  deb-debian:
    # Debian 12 .debs and portable tarballs share one build. PipeWire comes from
    # bookworm-backports (capture needs 1.0.5 or newer).
    name: .deb Debian 12 (${{ matrix.arch }})
    needs: [gate, linux-app]
    if: needs.gate.outputs.deb != 'skip'
    runs-on: ${{ matrix.runner }}
    container: debian:12
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      MODE: ${{ needs.gate.outputs.deb }}
      CARGO_TERM_COLOR: always
      CFLAGS: -O2
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything. (deb is in
        # NO_CACHE, so it is never warm.)
        run: |
          case "$MODE" in
            full) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - name: Build dependencies
        run: |
          echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates curl git build-essential pkg-config cmake clang libclang-dev libssl-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev python3 dpkg-dev lintian binutils xz-utils file
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends -t bookworm-backports libpipewire-0.3-dev
          # rustup-init pinned by version and SHA-256 (not a piped script).
          case "$(uname -m)" in
          x86_64) target=x86_64-unknown-linux-gnu sum=5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4 ;;
          aarch64) target=aarch64-unknown-linux-gnu sum=a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697 ;;
          esac
          curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/1.29.2/$target/rustup-init"
          echo "$sum  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.linux_release_commit || github.sha }}
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: deb-debian12-${{ matrix.arch }}
          save-if: ${{ !inputs.linux_release_commit && github.ref == 'refs/heads/main' }}

      - name: Build app, engine and CLI
        # No browser helper: it needs GTK 4.10+ and bookworm has 4.8, so the
        # Debian 12 package ships without browser sources (package-deb.sh).
        run: cargo build --release --locked -p isocast-ui -p isocast-daemon -p isocast-cli

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-binaries-${{ matrix.arch }}
          path: ubuntu
      - name: Package tarball and check core (glibc 2.36) and WebKit helper (2.39)
        run: |
          tar -C ubuntu -xf ubuntu/ubuntu-binaries.tar isocast-browser
          scripts/package-linux.sh target/release ubuntu/isocast-browser

      - name: Upload portable tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isocast-linux-${{ matrix.arch }}
          path: dist/isocast-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

      - name: Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/package-deb.sh target/release debian12
          dpkg-deb --info dist/isocast_*.deb
          dpkg-deb --contents dist/isocast_*.deb

      - name: lintian
        run: lintian --fail-on error --display-info dist/isocast_*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isocast-deb-debian12-${{ matrix.arch }}
          path: dist/isocast_*.deb
          retention-days: 30

  tarball-test:
    name: Portable tarball (${{ matrix.image }}, ${{ matrix.arch }})
    needs: deb-debian
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'debian:12', arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:12', arch: aarch64, runner: ubuntu-24.04-arm}
          - {image: 'archlinux:latest', arch: x86_64, runner: ubuntu-24.04}
    steps:
      - name: Debian runtime and recording probe
        if: matrix.image == 'debian:12'
        run: |
          echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends -t bookworm-backports libpipewire-0.3-0
          apt-get install -y --no-install-recommends ca-certificates curl bzip2 libgstreamer-plugins-base1.0-0 mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 ffmpeg python3
      - name: Arch runtime and recording probe
        if: matrix.image == 'archlinux:latest'
        run: pacman -Syu --needed --noconfirm libpipewire gst-plugins-base-libs vulkan-swrast vulkan-icd-loader ffmpeg python curl bzip2 webkitgtk-6.0 gtk4 dbus
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.linux_release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: isocast-linux-${{ matrix.arch }}
      - name: Install tarball and decode a synthetic take
        env:
          ISOCAST_CALIBRATION: 'off'
        run: |
          tar xzf isocast-linux-$(uname -m).tar.gz
          isocast-linux-$(uname -m)/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          trap 'isocast engine shutdown || true' EXIT
          isocast start packaging/linux/test-setup.toml --json > /tmp/take.json
          sleep 5
          isocast stop --wait --json
          python3 - <<'PY'
          import json, subprocess
          files = json.load(open('/tmp/take.json'))['files']
          assert len(files) == 3, files
          for path in files:
              data = subprocess.check_output(['ffprobe', '-v', 'error', '-count_frames', '-show_entries',
                                              'stream=codec_name,nb_read_frames', '-of', 'json', path])
              counts = {s['codec_name']: int(s['nb_read_frames']) for s in json.loads(data)['streams']}
              print(path, counts)
              assert counts['h264'] > 0 and counts['aac'] > 0, counts
          PY

      - name: Debian desktop and doctor with the incompatible browser helper present
        if: matrix.image == 'debian:12'
        env:
          ISOCAST_CALIBRATION: 'off'
          ISOCAST_SOCKET: /tmp/browser-check/engine.sock
          ISOCAST_SETUP: /tmp/browser-check/setup.toml
          XDG_RUNTIME_DIR: /tmp/browser-check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          trap 'isocast engine shutdown || true' EXIT
          test -x "$HOME/.local/lib/isocast/isocast-browser"
          isocast doctor --json > /tmp/doctor.json
          python3 - <<'PY'
          import json
          check, = (c for c in json.load(open('/tmp/doctor.json'))['checks'] if c['name'] == 'browser sources')
          print(check)
          assert check['status'] == 'warning' and ('is missing' in check['detail'] or 'GLIBC_' in check['detail']), check
          PY
          isocast apply --revision 0 packaging/linux/test-setup.toml
          isocast-ui --snapshot /tmp/desktop.png --size 640x400
          test -s /tmp/desktop.png

      - name: Record the optional WebKit browser source on Arch
        if: matrix.image == 'archlinux:latest'
        env:
          ISOCAST_CALIBRATION: 'off'
          ISOCAST_SOCKET: /tmp/browser-check/engine.sock
          ISOCAST_SETUP: /tmp/browser-check/setup.toml
          XDG_RUNTIME_DIR: /tmp/browser-check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          printf '%s\n' '<html style="background:#00ff00"></html>' > /tmp/green.html
          cat > /tmp/browser.toml <<'TOML'
          version = 1
          name = "Browser smoke"
          canvas = { width = 320, height = 180, fps = 30 }
          [recording]
          folder = "/tmp/browser-take"
          program = { encoder = { codec = "h264" } }
          [[sources]]
          id = "web"
          kind = "browser"
          file = "/tmp/green.html"
          width = 320
          height = 180
          fps = 30
          [[scenes]]
          id = "main"
          items = [{ source = "web", rect = { x = 0, y = 0, width = 320, height = 180 } }]
          TOML
          dbus-run-session -- sh -ec '
            trap "isocast engine shutdown || true" EXIT
            isocast start /tmp/browser.toml --json > /tmp/browser-take.json
            sleep 5
            isocast stop --wait --json
          '
          python3 - <<'PY'
          import json, subprocess
          path, = json.load(open('/tmp/browser-take.json'))['files']
          pixels = subprocess.check_output(['ffmpeg', '-v', 'error', '-i', path, '-an', '-vf', 'scale=1:1',
                                            '-pix_fmt', 'rgb24', '-f', 'rawvideo', '-'])
          green = sum(r < 40 and g > 200 and b < 40 for r, g, b in zip(pixels[::3], pixels[1::3], pixels[2::3]))
          print(f'{path}: {green}/{len(pixels)//3} frames show the green HTML page')
          assert green >= 2, 'the recorded program did not show the browser page'
          PY

  deb-ubuntu-test:
    # The Ubuntu .deb on a clean runner (no build tools): apt resolves its
    # Depends, doctor, per-user OpenH264, a 5 s CLI recording, purge.
    name: .deb Ubuntu 24.04 install test (${{ matrix.arch }})
    needs: deb-ubuntu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.linux_release_commit || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: isocast-deb-ubuntu24.04-${{ matrix.arch }}
          path: deb

      - name: Install
        timeout-minutes: 20
        run: |
          # Depends only (no Recommends): the app snapshot and the take must
          # work from what the package requires.
          .github/scripts/apt-install.sh ./deb/isocast_*.deb

      - name: Doctor, OpenH264, record 5 s, purge
        run: packaging/deb/test-installed.sh packaging/linux/test-setup.toml deb/isocast_*.deb

  deb-debian-test:
    # The Debian 12 .deb in a fresh debian:12 container, with backports.
    name: .deb Debian 12 install test (${{ matrix.arch }})
    needs: deb-debian
    runs-on: ${{ matrix.runner }}
    container: debian:12
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.linux_release_commit || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: isocast-deb-debian12-${{ matrix.arch }}
          path: deb

      - name: Install
        run: |
          echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get -o Acquire::Retries=3 update
          # As README.Debian says: PipeWire from backports first, then the package.
          apt-get -o Acquire::Retries=3 install -y -t bookworm-backports libpipewire-0.3-0
          # Depends only (no Recommends), as on Ubuntu.
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ./deb/isocast_*.deb
          # The test's own tools (not the package's).
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 sudo
          useradd -m packager
          # Only the reinstall and purge assertions use sudo; the desktop user
          # downloads the codec, snapshots the app and records without it.
          deb=(deb/isocast_*.deb)
          test "${#deb[@]}" = 1
          test -f "${deb[0]}"
          echo "packager ALL=(root) NOPASSWD: /usr/bin/dpkg -i ${deb[0]}, /usr/bin/apt-get purge -y isocast" > /etc/sudoers.d/isocast-test
          chmod 440 /etc/sudoers.d/isocast-test

      - name: Doctor, OpenH264, record 5 s, purge
        run: runuser -u packager -- packaging/deb/test-installed.sh packaging/linux/test-setup.toml deb/isocast_*.deb

  win-build:
    # W.1e: UI/native services compile with explicit platform stubs, not a
    # Windows capture, recording or shared-GPU-surface claim.
    # Native runtime checks run on exon-desk; this is the clean-machine build.
    # Builds once and uploads the binaries; the qualification jobs below run
    # in parallel from them (the single job took 70-83 minutes).
    name: Windows build, unit tests, contracts (windows-latest)
    needs: gate
    if: needs.gate.outputs.win_build != 'skip'
    runs-on: windows-latest
    # Keep main's proven memory-bounded build: debug symbols off, no kit
    # gallery, and the UI compiled separately with exactly one Cargo job.
    timeout-minutes: 90
    env:
      MODE: ${{ needs.gate.outputs.win_build }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Every step that can compile the UI, including Clippy/tests and the
      # second installer, must keep this setting or restore the large module.
      ISOCAST_UI_NO_GALLERY: '1'
      # Qualification artifacts only, never release builds. The private half
      # stays in the packaging lane's isolated VM-host folder, not GitHub.
      ISOCAST_WINDOWS_UPDATE_TEST: '1'
      ISOCAST_WINDOWS_UPDATE_KEY: '8mHwrJ82GhszmY2GnbKhW/qJsDL0XEYReeB5AsIT1Z0='
      ISOCAST_WINDOWS_APPCAST_URL: 'http://127.0.0.1:17745/appcast-windows-test.xml'
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: cache
        with:
          key: windows-engine
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Qualification build identity
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          export ISOCAST_WINDOWS_BUILD_VERSION="$version.1"
          echo "ISOCAST_WINDOWS_BASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ISOCAST_WINDOWS_BUILD_VERSION=$ISOCAST_WINDOWS_BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Build native services and test binaries (do not run)
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        run: cargo build --locked --all-targets -p isocast-engine -p isocast-platform-stub -p isocast-platform-windows -p isocast-vcam-dshow -p isocast-ipc -p isocast-discovery -p isocast-client -p isocast-daemon -p isocast-cli -p isocast-platform-contracts -p isocast-browser -p isocast-browser-protocol -p isocast-browser-host

      - name: Build 32-bit DirectShow camera for x86 consumers
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --locked --target i686-pc-windows-msvc -p isocast-vcam-dshow

      # Synchronous MF AAC transactions: serial, after the native build so
      # the test binary is cached. Package-only features can still rebuild
      # dependencies, so allow compilation time as well as test execution.
      - name: Check Media Foundation AAC transactions
        if: env.MODE == 'full'
        timeout-minutes: 30
        run: cargo test --locked -j 1 -p isocast-platform-windows --lib aac::tests -- --test-threads=1

      # Browser sources: the isocastd side against fake helpers (Python
      # scripts speaking the helper protocol: crash, hang, restart, sizes,
      # the job that ends WebView2's processes), and the helper's own checks.
      - name: Check browser sources
        if: env.MODE == 'full'
        timeout-minutes: 20
        run: |
          cargo clippy --locked --all-targets -p isocast-browser -p isocast-browser-protocol -p isocast-browser-host -- -D warnings
          cargo test --locked -p isocast-browser -p isocast-browser-protocol -p isocast-browser-host
          cargo test --locked -j 1 -p isocast-platform-windows --lib browser:: -- --test-threads=1

      # #157: a final manifest a reader holds open is retried, not lost.
      - name: Check final recording metadata publication
        if: env.MODE == 'full'
        timeout-minutes: 30
        run: cargo test --locked -j 1 -p isocast-engine --lib metadata_finalization

      - name: Check WASAPI clocks and application selectors without audio devices
        timeout-minutes: 15
        if: env.MODE == 'full'
        run: |
          cargo test --locked -j 1 -p isocast-platform-windows --lib audio -- --test-threads=1 --nocapture
          cargo test --locked -p isocast-vcam-wire -p isocast-vcam-dshow
          cargo clippy --locked -j 1 -p isocast-platform-windows -p isocast-vcam-wire -p isocast-vcam-dshow --all-targets -- -D warnings

      - name: Check monitoring channel mapping and conversion
        if: env.MODE == 'full'
        run: cargo test --locked -j 1 -p isocast-platform-windows --lib playback::tests

      - name: Check hotkey mapping and native registration status
        if: env.MODE == 'full'
        run: cargo test --locked -j 1 -p isocast-platform-windows --lib hotkeys::tests

      - name: Install FFmpeg for the media fixtures
        if: env.MODE == 'full'
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg' }
          }
          ffmpeg -version

      # Media Foundation decoding of files ffmpeg makes at test time (H.264/AAC
      # MP4 and MOV timing with edit lists and late tracks, WAV, an FFV1 file
      # no Windows decodes, and Store-extension codecs that must play or name
      # their extension). Serial: one D3D11 device.
      - name: Check media file decoding (Media Foundation)
        if: env.MODE == 'full'
        timeout-minutes: 30
        run: cargo test --locked -j 1 -p isocast-platform-windows --lib media::tests -- --test-threads=1 --nocapture

      # Slint compiles the whole interface into one generated Rust module
      # (the isocast-ui-interface crate, built once and shared by the app
      # and its tests); rustc needs 13.6 GiB for it (15.1 GiB committed),
      # measured on exon-desk, and run 39135916369 died with `rustc-LLVM
      # ERROR: out of memory` on this 16 GB runner when the module was
      # still compiled into the bin and its test binary side by side. So the
      # UI builds in its own step: one rustc at a time (-j 1), and without
      # the kit gallery (isocast-ui-interface/build.rs ISOCAST_UI_NO_GALLERY: the
      # `--state kit` design board, a quarter of the module), which brings
      # each rustc to 10.8 GiB (12.2 committed). The gallery's .slint is not
      # compiled here; macOS CI and the exon-desk qualification build it.
      # The same packages as the updater tests below, so Cargo resolves the
      # same features and `cargo test` reuses this build (with only
      # `-p isocast-ui` here, the tests rebuilt the dependencies and the
      # interface: 9.5 min, run 39947489790).
      - name: Build UI and its test binary (do not run)
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        id: native_build
        run: cargo build --locked --all-targets -j 1 -p isocast-client -p isocast-cli -p isocast-ui

      - name: Check updater clients
        if: env.MODE == 'full'
        run: |
          cargo clippy --locked --all-targets -j 1 -p isocast-discovery -p isocast-client -p isocast-cli -p isocast-ui -- -D warnings
          cargo test --locked -j 1 -p isocast-client -p isocast-cli -p isocast-ui

      - name: Check Platform contract harness
        if: env.MODE == 'full'
        run: |
          cargo clippy --locked --all-targets -p isocast-platform-contracts -- -D warnings
          python -m unittest discover -s scripts -p test_platform_contracts.py

      # Explicit CPU placeholder baseline, NOT native Windows qualification.
      - name: Clock and pool contracts (stub)
        if: env.MODE == 'full'
        run: python scripts/platform-contracts.py --bin target/debug/isocast-platform-contracts.exe --backend stub --suite core --work "$RUNNER_TEMP/platform-contracts"

      - name: Keep the first build for the qualification jobs
        # After the UI build, even if a check above failed: its binaries stay available.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && env.MODE == 'full' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/bins/first" | Out-Null
          foreach ($exe in @('isocast.exe', 'isocastd.exe', 'isocast-ui.exe', 'isocast-capture.exe', 'isocast-browser.exe')) { Copy-Item "target/debug/$exe" "$env:RUNNER_TEMP/bins/first/" }

      # A distinct compiled build, with the same qualification key, lets the
      # clean VM prove update and authenticated rollback without release keys.
      - name: Build second update candidate
        # After the UI build, even if a check above failed: its binaries stay available.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && env.MODE == 'full' }}
        run: |
          export ISOCAST_WINDOWS_BUILD_VERSION="$ISOCAST_WINDOWS_BASE_VERSION.2"
          # The UI build's package set (same features), so the dependencies
          # and the interface are reused. The version change reruns
          # isocast-client's build script (it reads ISOCAST_WINDOWS_BUILD_VERSION),
          # so isocast-client and the app recompile and isocast.exe relinks.
          cargo build --locked -j 1 -p isocast-client -p isocast-cli -p isocast-ui

      - name: Keep the second build
        # After the UI build, even if a check above failed: its binaries stay available.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && env.MODE == 'full' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/bins/next" | Out-Null
          foreach ($exe in @('isocast.exe', 'isocastd.exe', 'isocast-ui.exe', 'isocast-capture.exe', 'isocast-browser.exe')) { Copy-Item "target/debug/$exe" "$env:RUNNER_TEMP/bins/next/" }

      - name: Hand the builds to the qualification jobs
        # After the UI build, even if a check above failed: its binaries stay available.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && env.MODE == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-debug-bins
          path: ${{ runner.temp }}/bins
          if-no-files-found: error
          retention-days: 1

  win-recovery:
    # Recordings survive the engine and its process tree being killed.
    name: Windows recording recovery (windows-latest)
    needs: [gate, win-build]
    if: needs.gate.outputs.win_recovery != 'skip'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MODE: ${{ needs.gate.outputs.win_recovery }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The build's binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-debug-bins
          path: ${{ runner.temp }}/bins

      - name: Put the first build where the steps expect it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/debug | Out-Null
          Copy-Item "$env:RUNNER_TEMP/bins/first/*.exe" target/debug/

      - name: Install recording recovery decoder
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg' }
          }
          ffmpeg -version
          ffprobe -version

      - name: List application audio (real capture needs explicit tone fixtures)
        timeout-minutes: 5
        run: python scripts/e2e.py --daemon target/debug/isocastd.exe --cli target/debug/isocast.exe --only win_app_audio --only win_audio_exclude --codec h264 --timeout 180 --work "$RUNNER_TEMP/windows-app-audio" --keep-failures --report windows-app-audio.json

      - name: Keep application audio listing and fixture skip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app-audio
          path: windows-app-audio.json

      - name: Record with the preflight fallback after an injected NVENC open failure
        timeout-minutes: 5
        run: |
          python scripts/e2e.py --daemon target/debug/isocastd.exe --only win_encoder_preflight --engine-env ISOCAST_TEST_FAIL_NVENC_OPEN=1 --windows-profile 180p30 --codec h264 --timeout 180 --work "$RUNNER_TEMP/windows-preflight" --report windows-preflight.json
          python -c 'import json; r, = json.load(open("windows-preflight.json"))["scenarios"]; print(r["evidence"]); assert r["status"] == "PASS"'

      - name: Recover recordings and check isolated workspaces (hosted breakaway skip)
        timeout-minutes: 10
        run: python scripts/e2e.py --daemon target/debug/isocastd.exe --cli target/debug/isocast.exe --only win_recovery --only win_isolated --only win_machine_profile --codec h264 --timeout 420 --work "$RUNNER_TEMP/windows-recovery" --keep-failures --report windows-recovery.json

      - name: Recover a recording encoder at a same-file IDR
        timeout-minutes: 10
        run: |
          python scripts/e2e.py --daemon target/debug/isocastd.exe --only win_encoder_recovery --engine-env ISOCAST_TEST_RECOVERY_SUITE=1 --codec h264 --timeout 360 --work "$RUNNER_TEMP/encoder-recovery" --keep-failures --report encoder-recovery.json
          python -c 'import json; r, = json.load(open("encoder-recovery.json"))["scenarios"]; print(r["evidence"]); assert r["status"] == "PASS"'

      - name: Keep recording recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-recording-recovery
          path: |
            windows-recovery.json
            encoder-recovery.json
            ${{ runner.temp }}/encoder-recovery
            ${{ runner.temp }}/windows-recovery
          if-no-files-found: warn
          retention-days: 14

  win-wording:
    # The app's Windows wording, drawn offscreen against an isolated engine.
    name: Windows wording snapshots (windows-latest)
    needs: [gate, win-build]
    if: needs.gate.outputs.win_wording != 'skip'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MODE: ${{ needs.gate.outputs.win_wording }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The build's binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-debug-bins
          path: ${{ runner.temp }}/bins

      - name: Put the first build where the steps expect it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/debug | Out-Null
          Copy-Item "$env:RUNNER_TEMP/bins/first/*.exe" target/debug/

      - name: Windows wording snapshots (isolated, offscreen)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = "$env:RUNNER_TEMP/wording"
          New-Item -ItemType Directory -Force $work | Out-Null
          $env:ISOCAST_SOCKET = "$work/engine.sock"
          $env:ISOCAST_SETUP = "$work/setup.toml"
          $env:ISOCAST_CALIBRATION = 'off'
          $bin = (Resolve-Path target/debug).Path
          $env:ISOCAST_DAEMON = "$bin/isocastd.exe"
          Copy-Item scripts/screenshots/landscape.jpg, scripts/screenshots/brb.jpg $work
          $setup = (Get-Content scripts/screenshots/offscreen.toml -Raw).Replace('folder = "recordings"', ('folder = "' + $work.Replace('\','/') + '/recordings"'))
          [IO.File]::WriteAllText($env:ISOCAST_SETUP, $setup)
          $views = [ordered]@{
            permissions = @('permissions-sample:first-launch')
            denied = @('permissions-sample:denied')
            onboarding = @('first-run:2')
            general = @('settings:general', 'drag:1144,280,1144,560')
            stream = @('settings:stream')
            hotkeys = @('settings:hotkeys','hotkeys-sample')
            advanced = @('settings:advanced')
            tools = @('menu-bar-open:Tools')
            files = @('replay:saved')
          }
          # A hosted step runs in a job object that forbids breakaway, and
          # the CLI deliberately refuses to start a daemon that its caller's
          # job could kill (os error 5), so a recording always outlives its
          # caller. Start this throwaway daemon as the step's own child.
          Add-Type -Namespace Probe -Name Job -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool IsProcessInJob(IntPtr p, IntPtr j, out bool r); [DllImport("kernel32.dll")] public static extern bool QueryInformationJobObject(IntPtr j, int c, byte[] i, int n, IntPtr r);'
          $inJob = $false; $null = [Probe.Job]::IsProcessInJob([Diagnostics.Process]::GetCurrentProcess().Handle, [IntPtr]::Zero, [ref]$inJob)
          $limits = New-Object byte[] 144
          $flags = if ([Probe.Job]::QueryInformationJobObject([IntPtr]::Zero, 9, $limits, 144, [IntPtr]::Zero)) { [BitConverter]::ToUInt32($limits, 16) } else { 0 }
          "step job: in_job=$inJob breakaway_ok=$([bool]($flags -band 0x1800)) limit_flags=0x$($flags.ToString('x'))"
          $daemon = Start-Process $env:ISOCAST_DAEMON -PassThru -NoNewWindow -RedirectStandardOutput "$work/isocastd.out" -RedirectStandardError "$work/isocastd.err"
          $null = $daemon.Handle
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 250
              $status = & "$bin/isocast.exe" status --json | ConvertFrom-Json
            } until ($status.daemon.pid -eq $daemon.Id -or $daemon.HasExited -or (Get-Date) -gt $deadline)
            if ($status.daemon.pid -ne $daemon.Id) { throw 'Isolated wording daemon did not start' }
            & "$bin/isocast.exe" get --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Isolated wording daemon did not answer' }
            foreach ($view in $views.GetEnumerator()) {
              $arguments = @('--snapshot', "$work/$($view.Key).png", '--size', '1440x900', '--scale', '2', '--a11y')
              foreach ($state in $view.Value) { $arguments += @('--state', $state) }
              $process = Start-Process "$bin/isocast-ui.exe" -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput "$work/$($view.Key).txt" -RedirectStandardError "$work/$($view.Key).log"
              $null = $process.Handle
              if (-not $process.WaitForExit(60000)) { $process.Kill(); $process.WaitForExit(); throw "Snapshot timed out: $($view.Key)" }
              if ($process.ExitCode -ne 0 -or -not (Test-Path "$work/$($view.Key).png")) { throw "Snapshot failed: $($view.Key)" }
            }
            foreach ($args in @(@('permissions','--help'), @('setup','init','--help'), @('stream','key','--help'), @('capacity','--help'))) {
              $text = & "$bin/isocast.exe" @args | Out-String
              if ($LASTEXITCODE -ne 0 -or $text -match 'this Mac|Keychain|macOS|System Settings|~/Movies') { throw "Wrong Windows help: $args" }
              $text | Set-Content "$work/help-$($args -join '-').txt"
            }
          } finally {
            & "$bin/isocast.exe" engine shutdown --json
            if (-not $daemon.WaitForExit(15000)) { $daemon.Kill(); throw 'Could not shut down isolated wording daemon' }
          }

      - name: Keep native Windows wording evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-wording-snapshots
          path: ${{ runner.temp }}/wording
          if-no-files-found: warn
          retention-days: 14

  win-package:
    # W.7a: unsigned qualification only. No signing secrets or release writes.
    name: Windows installer and update packages (windows-latest)
    needs: [gate, win-build]
    if: needs.gate.outputs.win_package != 'skip'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MODE: ${{ needs.gate.outputs.win_package }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The build's binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-debug-bins
          path: ${{ runner.temp }}/bins

      - name: Put the first build where the steps expect it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/debug | Out-Null
          Copy-Item "$env:RUNNER_TEMP/bins/first/*.exe" target/debug/

      # W.7a: unsigned qualification only. No signing secrets or release writes.
      - name: Package per-user installer
        # Includes the pinned, security-patched WinSparkle source build.
        timeout-minutes: 20
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw 'x64 app-local Visual C++ CRT not found' }
          "ISOCAST_WINDOWS_CRT=$($crt.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          ./scripts/windows/package.ps1 -BinDir target/debug -OutputDir "$env:RUNNER_TEMP/windows-package" -ToolsDir "$env:RUNNER_TEMP/package-tools" -CrtDir $crt.FullName

      - name: Install and uninstall without deleting user files
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem "$env:RUNNER_TEMP/windows-package/*-setup.exe" | Select-Object -ExpandProperty FullName
          $install = "$env:LOCALAPPDATA\Programs\Isocast"
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
          & "$install\isocast.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI did not load' }
          $env:ISOCAST_CALIBRATION = 'off'
          # The step's job forbids breakaway, so the CLI refuses to launch the
          # daemon itself (see the wording step); start the installed one.
          # The clean-VM lifecycle qualifies the CLI's own adjacent launch.
          $daemon = Start-Process "$install\isocastd.exe" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/installed-isocastd.out" -RedirectStandardError "$env:RUNNER_TEMP/installed-isocastd.err"
          $null = $daemon.Handle # Retain this process identity even if its PID is reused.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Milliseconds 250
            $status = & "$install\isocast.exe" status --json | ConvertFrom-Json
          } until ($status.daemon.pid -eq $daemon.Id -or $daemon.HasExited -or (Get-Date) -gt $deadline)
          if ($status.daemon.pid -ne $daemon.Id) { throw 'The installed daemon did not start' }
          & "$install\isocast.exe" get --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI could not reach its daemon' }
          New-Item -ItemType Directory -Force "$install\recordings", "$env:LOCALAPPDATA\Isocast" | Out-Null
          'keep recording' | Set-Content "$install\recordings\keep.mp4"
          'keep settings' | Set-Content "$env:LOCALAPPDATA\Isocast\packaging-sentinel"
          $process = Start-Process "$install\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          if (-not $daemon.WaitForExit(5000)) { throw 'Uninstall did not stop the installed daemon' }
          $daemon.Dispose()
          if (Test-Path "$install\isocast.exe") { throw 'Executable remains after uninstall' }
          if ((Get-Content "$install\recordings\keep.mp4") -ne 'keep recording') { throw 'Recording removed or changed' }
          if ((Get-Content "$env:LOCALAPPDATA\Isocast\packaging-sentinel") -ne 'keep settings') { throw 'Settings removed or changed' }

      - name: Keep unsigned installer and exact payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unsigned
          path: ${{ runner.temp }}/windows-package
          if-no-files-found: error
          retention-days: 14

      - name: Package second update candidate
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./scripts/windows/package.ps1 -BinDir "$env:RUNNER_TEMP/bins/next" -OutputDir "$env:RUNNER_TEMP/windows-package-next" -ToolsDir "$env:RUNNER_TEMP/package-tools" -CrtDir $env:ISOCAST_WINDOWS_CRT

      - name: Keep second qualification installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unsigned-next
          path: ${{ runner.temp }}/windows-package-next
          if-no-files-found: error
          retention-days: 14

      - name: Retain successful builds even if packaging fails
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/windows-build-diagnostics"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item "$env:RUNNER_TEMP/bins/next/*.exe" $folder
          if ($env:ISOCAST_WINDOWS_CRT) { Copy-Item "$env:ISOCAST_WINDOWS_CRT\*.dll" $folder }
          Get-ChildItem $folder -File | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | ConvertTo-Json | Set-Content "$folder/hashes.json"

      - name: Keep unpackaged diagnostic binaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unpackaged-diagnostics
          path: ${{ runner.temp }}/windows-build-diagnostics
          if-no-files-found: error
          retention-days: 14

  win-release:
    # Host-specific recording qualification uses optimized services, not the
    # debug binaries of the build job; built here in parallel with it.
    name: Windows release qualification (windows-latest)
    needs: gate
    if: needs.gate.outputs.win_release != 'skip'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MODE: ${{ needs.gate.outputs.win_release }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Every step that can compile the UI, including Clippy/tests and the
      # second installer, must keep this setting or restore the large module.
      ISOCAST_UI_NO_GALLERY: '1'
      # Qualification artifacts only, never release builds. The private half
      # stays in the packaging lane's isolated VM-host folder, not GitHub.
      ISOCAST_WINDOWS_UPDATE_TEST: '1'
      ISOCAST_WINDOWS_UPDATE_KEY: '8mHwrJ82GhszmY2GnbKhW/qJsDL0XEYReeB5AsIT1Z0='
      ISOCAST_WINDOWS_APPCAST_URL: 'http://127.0.0.1:17745/appcast-windows-test.xml'
    defaults:
      run:
        shell: bash
    steps:
      - name: Gate mode
        # Fail closed: a job that runs without a mode from the gate would
        # skip every step and pass without checking anything.
        run: |
          case "$MODE" in
            full|warm) ;;
            *) echo "::error::the gate gave this job no valid mode ('$MODE'); not passing without running"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: cache
        with:
          key: windows-release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Qualification build identity
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          export ISOCAST_WINDOWS_BUILD_VERSION="$version.1"
          echo "ISOCAST_WINDOWS_BASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ISOCAST_WINDOWS_BUILD_VERSION=$ISOCAST_WINDOWS_BUILD_VERSION" >> "$GITHUB_ENV"

      # Host-specific recording qualification uses optimized services, not the debug
      # binaries used for recovery/contract checks above.
      - name: Build recording qualification services
        if: env.MODE == 'full' || steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked -j 2 -p isocast-daemon -p isocast-cli -p isocast-platform-windows -p isocast-browser --features isocast-daemon/vcam-diagnostics --bins --example monitor-loopback --example vcam-reader

      - name: Install recording recovery decoder
        if: env.MODE == 'full'
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg' }
          }
          ffmpeg -version
          ffprobe -version

      - name: Qualify headless profiles and protect recording by pausing previews
        if: env.MODE == 'full'
        timeout-minutes: 9
        run: python scripts/e2e.py --hosted --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_preview_recording --codec h264 --timeout 420 --work "$RUNNER_TEMP/windows-preview" --keep --report windows-preview.json

      - name: Check per-output GPU scaling, dimensions and decoded colors
        if: env.MODE == 'full'
        timeout-minutes: 4
        run: python scripts/e2e.py --daemon target/release/isocastd.exe --only win_output_scale --windows-profile 180p30 --codec h264 --work "$RUNNER_TEMP/windows-scale" --report windows-scale.json

      # A page through isocast-browser.exe (WebView2 on this runner's
      # console session, software rendering): frame codes advance in the ISO
      # and program, alpha blends over the layer beneath, the page's tone is
      # in both files, zero writer drops.
      - name: Record a browser source
        if: env.MODE == 'full'
        timeout-minutes: 10
        run: |
          python scripts/e2e.py --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_browser,browser_audio_gap --windows-profile 180p30 --codec h264 --timeout 300 --work "$RUNNER_TEMP/windows-browser" --keep-failures --report windows-browser.json
          # A skipped scenario would pass silently: it must have run.
          python - <<'PY'
          import json
          results = {s["name"]: s for s in json.load(open("windows-browser.json"))["scenarios"]}
          for name in ("win_browser", "browser_audio_gap"):
              scenario = results.get(name)
              assert scenario and scenario["status"] == "PASS", f"{name} did not pass: {scenario and (scenario['status'], scenario.get('reason'))}"
          print("browser:", {k: results["win_browser"]["evidence"][k] for k in ("first_picture_s", "web_codes", "program_codes", "alpha", "tone_windows", "audio_dropouts", "writer_drops", "unique_share_required")})
          print("browser_audio_gap:", {k: results["browser_audio_gap"]["evidence"][k] for k in ("live_dropouts", "stopped_dropouts", "manifest_dropouts")})
          PY

      - name: Keep browser source evidence
        if: (!cancelled()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-browser
          path: |
            windows-browser.json
            ${{ runner.temp }}/windows-browser
          if-no-files-found: warn
          retention-days: 14

      - name: Two camera pipe readers during live and held recording
        if: env.MODE == 'full'
        timeout-minutes: 4
        run: python scripts/e2e.py --daemon target/release/isocastd.exe --only win_vcam_publisher --windows-profile 180p30 --codec h264 --timeout 180 --work "$RUNNER_TEMP/windows-vcam" --report windows-vcam.json

      - name: Monitoring startup preserves recording audio (no-device skip on hosted Windows)
        if: env.MODE == 'full'
        timeout-minutes: 5
        run: python scripts/e2e.py --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_monitor --codec h264 --timeout 180 --work "$RUNNER_TEMP/windows-monitor" --keep --report windows-monitor.json

      # Strict (zero drops) at the hosted no-GPU reference canvas, 320x180p30.
      - name: Media file source (looping MP4 beside the test pattern)
        if: env.MODE == 'full'
        timeout-minutes: 8
        run: python scripts/e2e.py --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_media --windows-profile 180p30 --codec h264 --timeout 300 --work "$RUNNER_TEMP/windows-media" --keep-failures --report windows-media.json

      # #157: readers that block final manifest publication, at 320x180p30.
      - name: Recording metadata held open by a reader (split and final take)
        if: env.MODE == 'full'
        timeout-minutes: 5
        run: python scripts/e2e.py --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_metadata --windows-profile 180p30 --codec h264 --timeout 240 --work "$RUNNER_TEMP/windows-metadata" --keep-failures --report windows-metadata.json

      - name: Keep metadata publication evidence
        if: (!cancelled()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-metadata
          path: |
            windows-metadata.json
            ${{ runner.temp }}/windows-metadata
          if-no-files-found: warn
          retention-days: 14

      - name: Keep media source evidence
        if: (!cancelled()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-media
          path: |
            windows-media.json
            ${{ runner.temp }}/windows-media
          if-no-files-found: warn
          retention-days: 14

      - name: Keep monitoring hardware qualification binaries
        if: env.MODE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-monitor-binaries
          path: |
            target/release/isocastd.exe
            target/release/isocast.exe
            target/release/examples/monitor-loopback.exe
          retention-days: 7

      - name: Keep monitoring evidence
        if: (!cancelled()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-monitoring
          path: |
            windows-monitor.json
            ${{ runner.temp }}/windows-monitor
          retention-days: 14

      - name: Keep preview recording evidence
        if: (!cancelled()) && (env.MODE == 'full')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-recording
          path: |
            windows-preview.json
            ${{ runner.temp }}/windows-preview
          if-no-files-found: warn
          retention-days: 14
