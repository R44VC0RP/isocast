name: Windows
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 42317265101
          name: windows-x64-unsigned
          path: ${{ runner.temp }}/windows-package
      - name: Install and uninstall without deleting user files
        id: lifecycle
        timeout-minutes: 45
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem "$env:RUNNER_TEMP/windows-package/*-setup.exe" | Select-Object -ExpandProperty FullName
          $install = "$env:LOCALAPPDATA\Programs\Isocast"
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
          foreach ($dll in 'dxcompiler.dll', 'dxil.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $install $dll) -PathType Leaf)) {
              throw "Installer did not place $dll beside isocastd.exe"
            }
          }
          & "$install\isocast.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI did not load' }
          $env:ISOCAST_CALIBRATION = 'off'
          # The step's job forbids breakaway, so the CLI refuses to launch the
          # daemon itself (see the wording step); start the installed one.
          # The clean-VM lifecycle qualifies the CLI's own adjacent launch.
          $daemon = Start-Process "$install\isocastd.exe" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/installed-isocastd.out" -RedirectStandardError "$env:RUNNER_TEMP/installed-isocastd.err"
          $null = $daemon.Handle # Retain this process identity even if its PID is reused.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Milliseconds 250
            $status = & "$install\isocast.exe" status --json | ConvertFrom-Json
          } until ($status.daemon.pid -eq $daemon.Id -or $daemon.HasExited -or (Get-Date) -gt $deadline)
          if ($status.daemon.pid -ne $daemon.Id) { throw 'The installed daemon did not start' }
          & "$install\isocast.exe" get --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI could not reach its daemon' }
          New-Item -ItemType Directory -Force "$install\recordings", "$env:LOCALAPPDATA\Isocast" | Out-Null
          'keep recording' | Set-Content "$install\recordings\keep.mp4"
          'keep settings' | Set-Content "$env:LOCALAPPDATA\Isocast\packaging-sentinel"
          $log = "$env:RUNNER_TEMP\isocast-uninstall.log"
          $client = [IO.File]::OpenRead("$install\isocast.exe")
          try {
            $blocked = Start-Process "$install\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}.blocked"' -f $log) -Wait -PassThru
            $hits = @(Select-String -LiteralPath "$log.blocked" -SimpleMatch 'isocast.exe exclusively (Win32 error 32)')
            if ($blocked.ExitCode -ne 1 -or $daemon.HasExited -or $hits.Count -lt 2) { throw 'Persistent sharing violation was not refused safely' }
            Write-Host "Persistent CLI lock: exit 1, $($hits.Count) probes, daemon still running"
          } finally { $client.Dispose() }
          $release = Start-ThreadJob -ArgumentList $install,$log -ScriptBlock {
            param($install,$log)
            $file = [IO.File]::OpenRead("$install\isocast.exe")
            try {
              [IO.File]::WriteAllText("$log.ready", 'ready')
              $deadline = (Get-Date).AddSeconds(15)
              do {
                Start-Sleep -Milliseconds 20
                if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'isocast.exe exclusively') { Start-Sleep -Milliseconds 200; return }
              } until ((Get-Date) -gt $deadline)
              throw 'Did not observe CLI lock'
            } finally { $file.Dispose() }
          }
          $deadline = (Get-Date).AddSeconds(10)
          while (-not (Test-Path "$log.ready")) { if ((Get-Date) -gt $deadline) { throw 'Lock not ready' }; Start-Sleep -Milliseconds 20 }
          $process = Start-Process "$install\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="{0}"' -f $log) -Wait -PassThru
          if (Test-Path $log) { Select-String -Path $log -Pattern "Cannot open|Idle shutdown|InitializeUninstall|error" | ForEach-Object { Write-Host $_.Line } }
          Receive-Job $release -Wait -AutoRemoveJob -ErrorAction Stop
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          if (-not $daemon.WaitForExit(5000)) { throw 'Uninstall did not stop the installed daemon' }
          $daemon.Dispose()
          if (Test-Path "$install\isocast.exe") { throw 'Executable remains after uninstall' }
          if ((Get-Content "$install\recordings\keep.mp4") -ne 'keep recording') { throw 'Recording removed or changed' }
          if ((Get-Content "$env:LOCALAPPDATA\Isocast\packaging-sentinel") -ne 'keep settings') { throw 'Settings removed or changed' }

      - name: Keep uninstall diagnostics
        if: failure() && steps.lifecycle.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-uninstall-log
          path: |
            ${{ runner.temp }}/isocast-uninstall.log
            ${{ runner.temp }}/installed-isocastd.err
          retention-days: 14

