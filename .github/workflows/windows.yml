name: Windows

on:
  push:
    # ci/<lane>: candidates published by scripts/ci.sh before they merge.
    # main: catches a break that merged anyway, and saves the Rust caches
    # every lane restores (GitHub scopes caches to a branch, and only the
    # default branch's are readable from every other one).
    branches: [main, 'ci/**']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # Per branch, so lanes never cancel each other; a lane's newer candidate
  # cancels its older run, main's never.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  portable:
    name: portable (${{ matrix.os }})
    strategy:
      # Keep both platforms' diagnostics when one fails.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-portable
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      # W.0 is the OS-independent foundation, not a runnable Windows recorder.
      # Native service builds live below; recording qualification needs W.2+.
      - name: Build portable crates
        id: build
        run: cargo build --locked -p isocast-protocol -p isocast-diagnostics -p isocast-obsws -p isocast-mux

      - name: Clippy portable crates
        run: cargo clippy --locked --keep-going --all-targets -p isocast-protocol -p isocast-diagnostics -p isocast-obsws -p isocast-mux -- -D warnings

      - name: Test portable crates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast -p isocast-protocol -p isocast-diagnostics -p isocast-obsws -p isocast-mux

      - name: Protect adjacent release assets (no GitHub calls)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("release", "scripts/release-finalize.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          mac = {"Isocast-1.2.3-arm64.dmg", "Isocast-1.2.3-arm64.dmg.sha256", "appcast.xml"}
          windows = release.windows_asset_names("1.2.3")
          current = {}
          def read_only(*args, **kwargs):
              assert args[:2] == ("gh", "api") and "--method" not in args
              return json.dumps(current)
          release.command = read_only
          for names, accepted in [(mac, True), (mac | windows, True),
                                  (mac | {"appcast-windows.xml"}, False),
                                  (mac | windows | {"unexpected.exe"}, False)]:
              current = {"tag_name": "v1.2.3", "draft": False,
                         "assets": [{"name": name} for name in names]}
              try:
                  _, assets = release.published_release("v1.2.3", mac, allow_windows=True)
              except ValueError:
                  assert not accepted
              else:
                  assert accepted and set(assets) == names
          def forbidden(*args, **kwargs):
              raise AssertionError("draft replacement must stop before signing or writing")
          release.command = forbidden
          release.appcast = forbidden
          release.release_notes = lambda version: "Qualification notes"
          release.all_releases = lambda: [{"tag_name": "v1.2.3", "draft": True,
                                          "assets": [{"name": name} for name in mac | windows]}]
          try:
              release.draft_release(Path("unused"), {"version": "1.2.3"}, [], replace=True)
          except ValueError as error:
              assert "Windows assets" in str(error)
          else:
              raise AssertionError("Mac-only replacement accepted a Windows draft")
          print("Mac-only/full Windows sets accepted; partial/unknown sets and destructive replacement refused")
          PY

  linux:
    name: headless Linux daemon (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
      # libxaac-sys 0.1 invokes CMake without CMAKE_BUILD_TYPE or Cargo's
      # optimization level, even in release builds. Optimize native AAC too.
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Linux build and software Vulkan dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Ubuntu 24.04's PipeWire 1.0.5 supplies pw_buffer.time; this also installs libspa-0.2-dev.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential pkg-config libssl-dev libvulkan1 mesa-vulkan-drivers ffmpeg nasm cmake clang libclang-dev avahi-daemon dbus libpipewire-0.3-dev
          sudo systemctl start avahi-daemon
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: linux-server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon and CLI
        run: cargo build --release --locked -p isocast-daemon -p isocast-cli

      - name: Linux platform checks
        run: |
          cargo clippy --release --locked --all-targets -p isocast-platform-linux -p isocast-platform-credentials -p isocast-daemon -- -D warnings
          cargo test --release --locked -p isocast-platform-linux -p isocast-platform-credentials
          # The client's own tests on Linux too (the daemon's local and remote transports).
          cargo test --release --locked -p isocast-client
          cargo test --release --locked -p isocast-discovery
          cargo test --release --locked -p isocast-discovery avahi_advertise_browse_collision_and_withdraw -- --ignored --test-threads=1

      # Four hosted vCPUs saturate on three 720p software encodes plus
      # lavapipe. Use the existing hosted policy for this integrity smoke;
      # the six-vCPU arm64 VM separately qualifies strict 720p30 zero drops.
      - name: Synthetic program, ISOs and a stream (hosted 360p30)
        run: python3 scripts/e2e.py --hosted --only linux_record --only linux_recovery --only stream --linux-profile 360p30 --codec h264 --work "$RUNNER_TEMP/linux-e2e" --keep-failures --report linux-e2e.json

      - name: E2E summary
        if: always()
        run: |
          if test -f linux-e2e.json; then
            python3 scripts/e2e.py --summary linux-e2e.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Linux recording evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-e2e
          path: |
            linux-e2e.json
            ${{ runner.temp }}/linux-e2e
          retention-days: 7

  linux-capture:
    # The real Linux capture paths, on a headless desktop with no prompts
    # (scripts/linux-capture-fixture.sh): the screen through the ScreenCast
    # portal (sway, xdg-desktop-portal-wlr) over PipeWire, desktop audio from
    # PipeWire's default sink, a virtual microphone and, where the runner's
    # kernel takes v4l2loopback, a V4L2 camera. e2e.py linux_capture records
    # them at 480x270p30 for 15 s and checks every file decodes, each track
    # carries its own tone (440 Hz desktop, 880 Hz mic) and not the other, the
    # pictures are the clips' moving frame codes, and no file dropped a frame
    # or audio (zero, also under --hosted).
    name: Linux capture (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build and fixture dependencies
        timeout-minutes: 20
        run: |
          echo "FIXTURE=$RUNNER_TEMP/linux-capture-fixture" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential pkg-config libssl-dev libvulkan1 mesa-vulkan-drivers ffmpeg nasm cmake clang libclang-dev dbus libpipewire-0.3-dev
          scripts/linux-capture-fixture.sh deps
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The patched portal backend, built once per fixture script version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-capture-fixture/portal
          # The portal binary links the image's libpipewire and libwayland.
          key: linux-capture-portal-${{ matrix.arch }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('scripts/linux-capture-fixture.sh') }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: linux-capture-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build daemon and CLI
        timeout-minutes: 30
        run: cargo build --release --locked -p isocast-daemon -p isocast-cli

      - name: Start the headless desktop (portal, PipeWire, virtual devices)
        timeout-minutes: 10
        run: scripts/linux-capture-fixture.sh start "$FIXTURE" 640x360

      - name: Record screen, desktop audio, microphone and camera (hosted rules)
        timeout-minutes: 20
        run: |
          . "$FIXTURE/session.env"
          python3 scripts/e2e.py --hosted --only linux_capture --linux-profile 360p30 --codec h264 \
            --work "$RUNNER_TEMP/linux-capture" --keep-failures --report linux-capture.json
          # A skipped scenario would pass silently: it must have run.
          python3 - <<'PY'
          import json
          r = {s["name"]: s for s in json.load(open("linux-capture.json"))["scenarios"]}
          s = r.get("linux_capture")
          assert s and s["status"] == "PASS", f"linux_capture did not pass: {s and (s['status'], s.get('reason'))}"
          ev = s["evidence"]
          print("camera:", ev.get("camera"))
          if "skip" in str(ev.get("camera")).lower():
              print(f"::warning::linux_capture: camera skipped: {ev.get('camera')}")
          print("app audio:", ev.get("app_audio"))
          print("writer drops:", ev.get("writer_drops"))
          PY

      - name: E2E summary
        if: always()
        run: |
          if test -f linux-capture.json; then
            python3 scripts/e2e.py --summary linux-capture.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the desktop
        if: always()
        timeout-minutes: 2
        run: scripts/linux-capture-fixture.sh stop "$FIXTURE" || true

      - name: Capture evidence and fixture logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-capture-${{ matrix.arch }}
          path: |
            linux-capture.json
            ${{ runner.temp }}/linux-capture
            ${{ runner.temp }}/linux-capture-fixture/logs
            ${{ runner.temp }}/linux-capture-fixture/session.env
          retention-days: 7

  linux-app:
    # The desktop app on Linux against a local engine, and the tarball people
    # download (scripts/package-linux.sh): x86_64 and arm64. Rendering runs on
    # Mesa's software Vulkan here; a snapshot proves the window draws.
    name: Linux app + tarball (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      XDG_RUNTIME_DIR: /tmp/isocast-runtime
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Linux build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential pkg-config libssl-dev libvulkan1 mesa-vulkan-drivers nasm cmake clang libclang-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libpipewire-0.3-dev
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: linux-app-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build app, engine and CLI
        run: cargo build --release --locked -p isocast-ui -p isocast-daemon -p isocast-cli

      - name: App checks
        run: |
          cargo clippy --release --locked --all-targets -p isocast-ui -p isocast-protocol -p isocast-diagnostics -- -D warnings
          cargo test --release --locked -p isocast-ui -p isocast-protocol -p isocast-diagnostics

      - name: Offscreen snapshot against a local engine
        run: |
          work="$RUNNER_TEMP/linux-app"
          mkdir -p "$work"
          export ISOCAST_SOCKET="$work/engine.sock" ISOCAST_SETUP="$work/setup.toml" ISOCAST_CALIBRATION=off
          target/release/isocast apply --revision 0 packaging/linux/test-setup.toml
          target/release/isocast-ui --snapshot "$work/main.png" --size 1280x800 --wait-ms 3000
          target/release/isocast-ui --snapshot "$work/settings.png" --size 1280x800 --state settings:output
          target/release/isocast engine shutdown || true

      - name: Package
        run: scripts/package-linux.sh

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isocast-linux-${{ matrix.arch }}
          path: dist/isocast-linux-${{ matrix.arch }}.tar.gz
          retention-days: 30

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-app-snapshots-${{ matrix.arch }}
          path: ${{ runner.temp }}/linux-app/*.png
          retention-days: 7

  engine:
    # W.1e: UI/native services compile with explicit platform stubs, not a
    # Windows capture, recording or shared-GPU-surface claim.
    # Native runtime checks run on exon-desk; this is the clean-machine build.
    name: daemon + CLI + UI + installer (windows-latest)
    runs-on: windows-latest
    # Keep main's proven memory-bounded build: debug symbols off, no kit
    # gallery, and the UI compiled separately with exactly one Cargo job.
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Every step that can compile the UI, including Clippy/tests and the
      # second installer, must keep this setting or restore the large module.
      ISOCAST_UI_NO_GALLERY: '1'
      # Qualification artifacts only, never release builds. The private half
      # stays in the packaging lane's isolated VM-host folder, not GitHub.
      ISOCAST_WINDOWS_UPDATE_TEST: '1'
      ISOCAST_WINDOWS_UPDATE_KEY: '8mHwrJ82GhszmY2GnbKhW/qJsDL0XEYReeB5AsIT1Z0='
      ISOCAST_WINDOWS_APPCAST_URL: 'http://127.0.0.1:17745/appcast-windows-test.xml'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-engine
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Qualification build identity
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          export ISOCAST_WINDOWS_BUILD_VERSION="$version.1"
          echo "ISOCAST_WINDOWS_BASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "ISOCAST_WINDOWS_BUILD_VERSION=$ISOCAST_WINDOWS_BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Build native services and test binaries (do not run)
        run: cargo build --locked --all-targets -p isocast-engine -p isocast-platform-stub -p isocast-platform-windows -p isocast-ipc -p isocast-discovery -p isocast-client -p isocast-daemon -p isocast-cli -p isocast-platform-contracts

      # Synchronous MF AAC transactions: serial, after the native build so
      # the test binary is cached. Package-only features can still rebuild
      # dependencies, so allow compilation time as well as test execution.
      - name: Check Media Foundation AAC transactions
        timeout-minutes: 30
        run: cargo test --locked -j 1 -p isocast-platform-windows --lib aac::tests -- --test-threads=1

      - name: Install recording recovery decoder
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.0.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install FFmpeg' }
          }
          ffmpeg -version
          ffprobe -version

      - name: Recover recordings after engine and process-tree termination
        timeout-minutes: 10
        run: python scripts/e2e.py --daemon target/debug/isocastd.exe --cli target/debug/isocast.exe --only win_recovery --codec h264 --timeout 420 --work "$RUNNER_TEMP/windows-recovery" --keep-failures --report windows-recovery.json

      - name: Keep recording recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-recording-recovery
          path: |
            windows-recovery.json
            ${{ runner.temp }}/windows-recovery
          if-no-files-found: warn
          retention-days: 14

      # Host-specific recording qualification uses optimized services, not the debug
      # binaries used for recovery/contract checks above.
      - name: Build recording qualification services
        run: cargo build --release --locked -j 2 -p isocast-daemon -p isocast-cli --bins

      - name: Qualify headless profiles and protect recording by pausing previews
        timeout-minutes: 9
        run: python scripts/e2e.py --daemon target/release/isocastd.exe --cli target/release/isocast.exe --only win_preview_recording --codec h264 --timeout 420 --work "$RUNNER_TEMP/windows-preview" --keep --report windows-preview.json

      - name: Keep preview recording evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-recording
          path: |
            windows-preview.json
            ${{ runner.temp }}/windows-preview
          if-no-files-found: warn
          retention-days: 14

      # Slint compiles the whole interface into one generated Rust module
      # (the isocast-ui-interface crate, built once and shared by the app
      # and its tests); rustc needs 13.6 GiB for it (15.1 GiB committed),
      # measured on exon-desk, and run 39135916369 died with `rustc-LLVM
      # ERROR: out of memory` on this 16 GB runner when the module was
      # still compiled into the bin and its test binary side by side. So the
      # UI builds in its own step: one rustc at a time (-j 1), and without
      # the kit gallery (isocast-ui-interface/build.rs ISOCAST_UI_NO_GALLERY: the
      # `--state kit` design board, a quarter of the module), which brings
      # each rustc to 10.8 GiB (12.2 committed). The gallery's .slint is not
      # compiled here; macOS CI and the exon-desk qualification build it.
      # The same packages as the updater tests below, so Cargo resolves the
      # same features and `cargo test` reuses this build (with only
      # `-p isocast-ui` here, the tests rebuilt the dependencies and the
      # interface: 9.5 min, run 39947489790).
      - name: Build UI and its test binary (do not run)
        id: native_build
        run: cargo build --locked --all-targets -j 1 -p isocast-client -p isocast-cli -p isocast-ui

      - name: Check updater clients
        run: |
          cargo clippy --locked --all-targets -j 1 -p isocast-discovery -p isocast-client -p isocast-cli -p isocast-ui -- -D warnings
          cargo test --locked -j 1 -p isocast-client -p isocast-cli -p isocast-ui

      - name: Check Platform contract harness
        run: |
          cargo clippy --locked --all-targets -p isocast-platform-contracts -- -D warnings
          python -m unittest discover -s scripts -p test_platform_contracts.py

      # Explicit CPU placeholder baseline, NOT native Windows qualification.
      - name: Clock and pool contracts (stub)
        run: python scripts/platform-contracts.py --bin target/debug/isocast-platform-contracts.exe --backend stub --suite core --work "$RUNNER_TEMP/platform-contracts"

      - name: Windows wording snapshots (isolated, offscreen)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = "$env:RUNNER_TEMP/wording"
          New-Item -ItemType Directory -Force $work | Out-Null
          $env:ISOCAST_SOCKET = "$work/engine.sock"
          $env:ISOCAST_SETUP = "$work/setup.toml"
          $env:ISOCAST_CALIBRATION = 'off'
          $bin = (Resolve-Path target/debug).Path
          $env:ISOCAST_DAEMON = "$bin/isocastd.exe"
          Copy-Item scripts/screenshots/landscape.jpg, scripts/screenshots/brb.jpg $work
          $setup = (Get-Content scripts/screenshots/offscreen.toml -Raw).Replace('folder = "recordings"', ('folder = "' + $work.Replace('\','/') + '/recordings"'))
          [IO.File]::WriteAllText($env:ISOCAST_SETUP, $setup)
          $views = [ordered]@{
            permissions = @('permissions-sample:first-launch')
            denied = @('permissions-sample:denied')
            onboarding = @('first-run:2')
            general = @('settings:general', 'drag:1144,280,1144,560')
            stream = @('settings:stream')
            hotkeys = @('settings:hotkeys','hotkeys-sample')
            advanced = @('settings:advanced')
            tools = @('menu-bar-open:Tools')
            files = @('replay:saved')
          }
          # A hosted step runs in a job object that forbids breakaway, and
          # the CLI deliberately refuses to start a daemon that its caller's
          # job could kill (os error 5), so a recording always outlives its
          # caller. Start this throwaway daemon as the step's own child.
          Add-Type -Namespace Probe -Name Job -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool IsProcessInJob(IntPtr p, IntPtr j, out bool r); [DllImport("kernel32.dll")] public static extern bool QueryInformationJobObject(IntPtr j, int c, byte[] i, int n, IntPtr r);'
          $inJob = $false; $null = [Probe.Job]::IsProcessInJob([Diagnostics.Process]::GetCurrentProcess().Handle, [IntPtr]::Zero, [ref]$inJob)
          $limits = New-Object byte[] 144
          $flags = if ([Probe.Job]::QueryInformationJobObject([IntPtr]::Zero, 9, $limits, 144, [IntPtr]::Zero)) { [BitConverter]::ToUInt32($limits, 16) } else { 0 }
          "step job: in_job=$inJob breakaway_ok=$([bool]($flags -band 0x1800)) limit_flags=0x$($flags.ToString('x'))"
          $daemon = Start-Process $env:ISOCAST_DAEMON -PassThru -NoNewWindow -RedirectStandardOutput "$work/isocastd.out" -RedirectStandardError "$work/isocastd.err"
          $null = $daemon.Handle
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 250
              $status = & "$bin/isocast.exe" status --json | ConvertFrom-Json
            } until ($status.daemon.pid -eq $daemon.Id -or $daemon.HasExited -or (Get-Date) -gt $deadline)
            if ($status.daemon.pid -ne $daemon.Id) { throw 'Isolated wording daemon did not start' }
            & "$bin/isocast.exe" get --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Isolated wording daemon did not answer' }
            foreach ($view in $views.GetEnumerator()) {
              $arguments = @('--snapshot', "$work/$($view.Key).png", '--size', '1440x900', '--scale', '2', '--a11y')
              foreach ($state in $view.Value) { $arguments += @('--state', $state) }
              $process = Start-Process "$bin/isocast-ui.exe" -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput "$work/$($view.Key).txt" -RedirectStandardError "$work/$($view.Key).log"
              $null = $process.Handle
              if (-not $process.WaitForExit(60000)) { $process.Kill(); $process.WaitForExit(); throw "Snapshot timed out: $($view.Key)" }
              if ($process.ExitCode -ne 0 -or -not (Test-Path "$work/$($view.Key).png")) { throw "Snapshot failed: $($view.Key)" }
            }
            foreach ($args in @(@('permissions','--help'), @('setup','init','--help'), @('stream','key','--help'), @('capacity','--help'))) {
              $text = & "$bin/isocast.exe" @args | Out-String
              if ($LASTEXITCODE -ne 0 -or $text -match 'this Mac|Keychain|macOS|System Settings|~/Movies') { throw "Wrong Windows help: $args" }
              $text | Set-Content "$work/help-$($args -join '-').txt"
            }
          } finally {
            & "$bin/isocast.exe" engine shutdown --json
            if (-not $daemon.WaitForExit(15000)) { $daemon.Kill(); throw 'Could not shut down isolated wording daemon' }
          }

      - name: Keep native Windows wording evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-wording-snapshots
          path: ${{ runner.temp }}/wording
          if-no-files-found: warn
          retention-days: 14

      # W.7a: unsigned qualification only. No signing secrets or release writes.
      - name: Package per-user installer
        # Includes the pinned, security-patched WinSparkle source build.
        timeout-minutes: 20
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw 'x64 app-local Visual C++ CRT not found' }
          "ISOCAST_WINDOWS_CRT=$($crt.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          ./scripts/windows/package.ps1 -BinDir target/debug -OutputDir "$env:RUNNER_TEMP/windows-package" -ToolsDir "$env:RUNNER_TEMP/package-tools" -CrtDir $crt.FullName

      - name: Install and uninstall without deleting user files
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem "$env:RUNNER_TEMP/windows-package/*-setup.exe" | Select-Object -ExpandProperty FullName
          $install = "$env:LOCALAPPDATA\Programs\Isocast"
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
          & "$install\isocast.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI did not load' }
          $env:ISOCAST_CALIBRATION = 'off'
          # The step's job forbids breakaway, so the CLI refuses to launch the
          # daemon itself (see the wording step); start the installed one.
          # The clean-VM lifecycle qualifies the CLI's own adjacent launch.
          $daemon = Start-Process "$install\isocastd.exe" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/installed-isocastd.out" -RedirectStandardError "$env:RUNNER_TEMP/installed-isocastd.err"
          $null = $daemon.Handle # Retain this process identity even if its PID is reused.
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Milliseconds 250
            $status = & "$install\isocast.exe" status --json | ConvertFrom-Json
          } until ($status.daemon.pid -eq $daemon.Id -or $daemon.HasExited -or (Get-Date) -gt $deadline)
          if ($status.daemon.pid -ne $daemon.Id) { throw 'The installed daemon did not start' }
          & "$install\isocast.exe" get --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI could not reach its daemon' }
          New-Item -ItemType Directory -Force "$install\recordings", "$env:LOCALAPPDATA\Isocast" | Out-Null
          'keep recording' | Set-Content "$install\recordings\keep.mp4"
          'keep settings' | Set-Content "$env:LOCALAPPDATA\Isocast\packaging-sentinel"
          $process = Start-Process "$install\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          if (-not $daemon.WaitForExit(5000)) { throw 'Uninstall did not stop the installed daemon' }
          $daemon.Dispose()
          if (Test-Path "$install\isocast.exe") { throw 'Executable remains after uninstall' }
          if ((Get-Content "$install\recordings\keep.mp4") -ne 'keep recording') { throw 'Recording removed or changed' }
          if ((Get-Content "$env:LOCALAPPDATA\Isocast\packaging-sentinel") -ne 'keep settings') { throw 'Settings removed or changed' }

      - name: Keep unsigned installer and exact payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unsigned
          path: ${{ runner.temp }}/windows-package
          if-no-files-found: error
          retention-days: 14

      # A distinct compiled build, with the same qualification key, lets the
      # clean VM prove update and authenticated rollback without release keys.
      - name: Build second update candidate
        run: |
          export ISOCAST_WINDOWS_BUILD_VERSION="$ISOCAST_WINDOWS_BASE_VERSION.2"
          # The UI build's package set (same features), so the dependencies
          # and the interface are reused. The version change reruns
          # isocast-client's build script (it reads ISOCAST_WINDOWS_BUILD_VERSION),
          # so isocast-client and the app recompile and isocast.exe relinks.
          cargo build --locked -j 1 -p isocast-client -p isocast-cli -p isocast-ui

      - name: Package second update candidate
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./scripts/windows/package.ps1 -BinDir target/debug -OutputDir "$env:RUNNER_TEMP/windows-package-next" -ToolsDir "$env:RUNNER_TEMP/package-tools" -CrtDir $env:ISOCAST_WINDOWS_CRT

      - name: Keep second qualification installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unsigned-next
          path: ${{ runner.temp }}/windows-package-next
          if-no-files-found: error
          retention-days: 14

      - name: Retain successful builds even if packaging fails
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/windows-build-diagnostics"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item target/debug/isocast.exe, target/debug/isocastd.exe, target/debug/isocast-ui.exe, target/debug/isocast-capture.exe $folder
          if ($env:ISOCAST_WINDOWS_CRT) { Copy-Item "$env:ISOCAST_WINDOWS_CRT\*.dll" $folder }
          Get-ChildItem $folder -File | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | ConvertTo-Json | Set-Content "$folder/hashes.json"

      - name: Keep unpackaged diagnostic binaries
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-unpackaged-diagnostics
          path: ${{ runner.temp }}/windows-build-diagnostics
          if-no-files-found: error
          retention-days: 14
