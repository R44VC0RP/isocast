name: Verify AWS secrets

# Temporary: proves each environment's role can read the migrated secrets,
# printing only the name (never the value). Deleted once the migration is
# confirmed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/isocast-release
          role-session-name: isocast-release-check-${{ github.run_id }}
          aws-region: us-east-1
      - name: Read the release secrets
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          set +x
          # Only the name and line count are printed; the value never is.
          check() {
            local name="$1" value lines
            value=$(aws secretsmanager get-secret-value --secret-id "isocast/release/$name" --query SecretString --output text)
            if [ -z "$value" ]; then echo "::error::$name is empty"; exit 1; fi
            lines=$(printf '%s' "$value" | awk 'END { print NR }')
            echo "$name ok (lines=$lines)"
          }
          check APPLE_API_ISSUER_ID
          check APPLE_API_KEY_ID
          check APPLE_API_KEY_P8_BASE64
          check CAMERA_PROVISIONING_PROFILE_B64
          check DEVELOPER_ID_P12_BASE64
          check DEVELOPER_ID_P12_PASSWORD
          check ENGINE_PROVISIONING_PROFILE_B64
          check SPARKLE_ED_PRIVATE_KEY
          if [ "${#APPLE_TEAM_ID}" -ne 10 ]; then echo "::error::vars.APPLE_TEAM_ID is not a 10-character team id"; exit 1; fi
          echo "vars.APPLE_TEAM_ID ok (10 characters)"

  visual-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: visual-judge
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/isocast-visual-judge
          role-session-name: isocast-visual-judge-check-${{ github.run_id }}
          aws-region: us-east-1
      - name: Read the visual-judge secrets
        run: |
          set -euo pipefail
          set +x
          check() {
            local name="$1" value lines
            value=$(aws secretsmanager get-secret-value --secret-id "isocast/visual-judge/$name" --query SecretString --output text)
            if [ -z "$value" ]; then echo "::error::$name is empty"; exit 1; fi
            lines=$(printf '%s' "$value" | awk 'END { print NR }')
            echo "$name ok (lines=$lines)"
          }
          check OPENCODE_API_KEY
