[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but the retired web app (isocast-app): the Slint app
# (isocast-ui) is Isocast.app since N.3. The web app's crate stays until
# Ryan has used the Slint app for the alpha week; `-p isocast-app` still
# builds it.
default-members = [
    "crates/isocast-cli",
    "crates/isocast-client",
    "crates/isocast-daemon",
    "crates/isocast-discovery",
    "crates/isocast-engine",
    "crates/isocast-obsws",
    "crates/isocast-platform-macos",
    "crates/isocast-protocol",
    "crates/isocast-surfaces",
    "crates/isocast-ui",
    "crates/isocast-ui-interface",
]

[workspace.package]
version = "0.0.8"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/R44VC0RP/isocast"

# Slint's winit renderer needs an application-owned composition surface on
# Windows. Pinned upstream sources, with the small WGPU surface hook described
# in vendor/i-slint-renderer-skia/ISocast.md; other platforms are unchanged.
[patch.crates-io]
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
# xaac-rs 0.2.0 assumes signed c_char; Linux arm64 uses unsigned c_char.
xaac-rs = { path = "vendor/xaac-rs" }

# Noise suppression (RNNoise) runs in real time, and unoptimised it costs
# about 11% of a core per channel, so its crates are optimised even in
# debug builds (which the dev app runs).
# The interface's generated module (isocast-ui-interface) without debug
# info: rustc's peak memory for it drops from 18.1 to 14.4 GiB and its build
# from 148 to 126 s (isocast-m2-a, 2026-10-23); GitHub's 7 GB macOS runners
# swap through it. Its line tables would only point into generated code.
[profile.dev.package.isocast-ui-interface]
debug = 0

[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.easyfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

# Builds to hand out (`cargo build --profile dist`): link-time optimisation
# across crates and one codegen unit. The engine binary is 30% smaller
# (21.0 to 14.6 MB); CPU use measured the same as `release` (its time is
# spent in the OS's capture, GPU and encoder frameworks), and builds take
# ~8× longer, so day-to-day release builds stay as they are.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The app's development loop (`cargo build --profile ui-dev -p isocast-ui
# --features live-slint`, see docs/handoff/agent-rules.md): `release`, but
# incremental, so a Rust edit in isocast-ui rebuilds in seconds (measured
# 2.7-3.8 s against 17 s without, and ~345 s for a compiled-interface
# release build). Its own folder, so release builds and their caches are untouched.
[profile.ui-dev]
inherits = "release"
incremental = true
