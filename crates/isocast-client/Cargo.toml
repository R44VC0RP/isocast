[package]
name = "isocast-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The client side of isocastd's control socket, shared by the CLI, MCP and the app."

[features]
# Watching pictures through GPU surfaces shared with the daemon
# (`shared_frames`), and wrapping them as wgpu textures.
shared = ["dep:isocast-surfaces"]
wgpu = ["shared", "isocast-surfaces/wgpu", "dep:wgpu"]

[dependencies]
isocast-diagnostics = { path = "../isocast-diagnostics" }
anyhow = "1.0.104"
isocast-protocol = { path = "../isocast-protocol" }
isocast-ipc = { path = "../isocast-ipc" }
isocast-remote = { path = "../isocast-remote" }
isocast-platform-credentials = { path = "../isocast-platform-credentials" }
isocast-surfaces = { path = "../isocast-surfaces", optional = true }
serde = "1.0.229"
serde_json = "1.0.154"
tempfile = "3.27.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"], optional = true }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading"] }
