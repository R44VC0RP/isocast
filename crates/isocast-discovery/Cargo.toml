[package]
name = "isocast-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Finding Isocast engines on the local network through the operating system's own DNS-SD responder."

[dependencies]
anyhow = "1.0.104"
isocast-diagnostics = { path = "../isocast-diagnostics" }

# Bonjour's dns_sd.h is part of libSystem: no library to link, no crate.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_System_SystemInformation",
] }
