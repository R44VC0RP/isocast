[package]
name = "isocast-openh264"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run-time OpenH264 selection on Linux: Cisco's verified download or a compatible system library."

# No `source` feature: no OpenH264 is compiled into Isocast. Cisco's patent
# licence covers only Cisco's own binary, which the installer downloads
# (packaging/linux/install.sh --openh264).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
openh264 = { version = "=0.9.9", default-features = false, features = ["libloading"] }
sha2 = "0.10.9"
