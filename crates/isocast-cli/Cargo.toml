[package]
name = "isocast-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line control for Isocast."

[[bin]]
name = "isocast"
path = "src/main.rs"

[dependencies]
isocast-diagnostics = { path = "../isocast-diagnostics" }
base64 = "0.22.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3"
isocast-client = { path = "../isocast-client" }
isocast-discovery = { path = "../isocast-discovery" }
isocast-engine = { path = "../isocast-engine" }
isocast-protocol = { path = "../isocast-protocol" }
libc = "0.2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt", "macros"] }
toml = "1.1.8"

[target.'cfg(target_os = "macos")'.dependencies]
isocast-client = { path = "../isocast-client", features = ["wgpu"] }
isocast-surfaces = { path = "../isocast-surfaces" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `frames --shared` (src/shared_frames.rs): shared-memory frames, checked
# without a GPU.
isocast-client = { path = "../isocast-client", features = ["wgpu"] }
isocast-surfaces = { path = "../isocast-surfaces" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console"] }
isocast-client = { path = "../isocast-client", features = ["wgpu"] }
isocast-surfaces = { path = "../isocast-surfaces" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
