[package]
name = "isocast-surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU surfaces isocastd shares with its clients without copying (IOSurfaces handed over Mach on macOS)."

[features]
# Wrap surfaces as wgpu textures (the daemon draws into them; clients like
# the app show them).
wgpu = ["dep:wgpu"]

[dependencies]
anyhow = "1.0.104"
# Pinned like the engine's: textures are wrapped through wgpu-hal.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# memfd, mmap and SCM_RIGHTS (src/linux.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
isocast-ipc = { path = "../isocast-ipc" }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security",
    "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading",
    "Win32_System_Performance", "Win32_System_RemoteDesktop",
] }
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6.0"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
