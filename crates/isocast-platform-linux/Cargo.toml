[package]
name = "isocast-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Linux backend: Vulkan compositing and software recording."

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.104"
isocast-engine = { path = "../isocast-engine" }
isocast-diagnostics = { path = "../isocast-diagnostics" }
isocast-protocol = { path = "../isocast-protocol" }
isocast-platform-credentials = { path = "../isocast-platform-credentials" }
isocast-surfaces = { path = "../isocast-surfaces" }
isocast-mux = { path = "../isocast-mux" }
libc = "0.2"
# MIT portal and PipeWire bindings; native PipeWire is MIT.
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = { version = "=0.10.1", features = ["v0_3_77"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Cisco's OpenH264 binary, downloaded by the installer and loaded at run
# time (BSD-2-Clause wrapper, no OpenH264 compiled in; no GPL codec).
isocast-openh264 = { path = "../isocast-openh264" }
# Apache-2.0 wrapper and bundled libxaac (AAC-LC); not FDK AAC.
xaac-rs = "=0.2.0"
