[package]
name = "isocast-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows native media back end for Isocast."

[[bin]]
name = "isocast-capture"
path = "src/bin/isocast-capture.rs"

[build-dependencies]
# Already locked: compile the small C++ boundary against NVIDIA's public ABI
# instead of hand-maintaining Rust layouts for its versioned bitfield structs.
cc = "1.8.0"

[target.'cfg(windows)'.dependencies]
isocast-platform-credentials = { path = "../isocast-platform-credentials" }
anyhow = "1.0.104"
isocast-diagnostics = { path = "../isocast-diagnostics" }
isocast-engine = { path = "../isocast-engine" }
isocast-mux = { path = "../isocast-mux" }
isocast-protocol = { path = "../isocast-protocol" }
isocast-surfaces = { path = "../isocast-surfaces", features = ["wgpu"] }
parking_lot = "0.12"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
# The COM lease attached to an imported resource uses the implementation
# macro's windows-core path. Same version already used by windows/wgpu.
windows-core = "0.62.2"
# Already locked by wgpu's DX12 backend. WinRT capture and native D3D11
# interfaces must use the same bindings as the DX12 importer.
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Capture_Frames",
    "Media_MediaProperties",
    "Storage_Streams",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Display",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
] }
