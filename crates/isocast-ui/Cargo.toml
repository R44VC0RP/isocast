[package]
name = "isocast-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Isocast app rebuilt in Slint (spike): a portable native window, a thin client of isocastd."
# Slint is used under its royalty-free licence, which asks for the
# "About Slint" notice the app shows in Help → About Isocast.

[features]
# Development only, never in a shipped build: the interface is read from
# ui/*.slint by Slint's interpreter when the app starts (and again after an
# edit, under `--snapshot-watch`) instead of being compiled into the
# binary, so a layout change needs no rebuild and a Rust change rebuilds
# far less. Same Slint version; see build.rs.
live-slint = ["slint/live-preview"]

[[bin]]
name = "isocast-ui"
path = "src/main.rs"

[dependencies]
isocast-diagnostics = { path = "../isocast-diagnostics" }
anyhow = "1.0.104"
# `wgpu`: the daemon's shared frames as wgpu textures (the portable preview).
isocast-client = { path = "../isocast-client", features = ["wgpu"] }
isocast-protocol = { path = "../isocast-protocol" }
# The test-only element search API (accessible roles and names), used by
# `--a11y` to print what screen readers are given.
i-slint-backend-testing = "=1.18.1"
png = "0.18.1"
serde = "1.0.229"
serde_json = "1.0.154"
# The motion harness's suites (src/motion/scenario.rs); already the
# workspace's setup format.
toml = "1.1.8"
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-skia",
    "unstable-wgpu-30",
    "unstable-winit-030",
] }
# The engine's wgpu, pinned the same (its frame import uses wgpu-hal), so
# the preview can share GPU textures with it. Slint's Skia renderer adds
# the platform's backend (Metal on macOS, DX12 on Windows).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
i-slint-renderer-skia = { version = "=1.18.1", default-features = false, features = ["unstable-wgpu-30"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"
# Real process counters: Windows UI measurements must not report stub zeroes.
# Console (a GUI program that writes to the terminal it ran from), Shell
# (opening web pages and Explorer), DWM/GDI/Controls/HiDpi (dark title and
# menu bars, the first window's size: src/chrome_windows.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# macOS: the preview's picture and selection box as Core Animation layers
# under the window's interface (see src/layers.rs), so the interface isn't
# redrawn for every video frame.
[target.'cfg(target_os = "macos")'.dependencies]
# The NSEvent key monitor's handler (src/keys.rs: focused hotkeys).
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFString", "CFUUID"] }
# CGImage and CGContext: the Create view's clip thumbnails (src/thumbs.rs).
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace", "CGContext", "CGImage"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6.2"

[build-dependencies]
slint-build = "=1.18.1"
