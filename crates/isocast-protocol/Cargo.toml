[package]
name = "isocast-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Setup document types and validation for Isocast."

[dependencies]
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
toml = "1.1.8"

[target.'cfg(not(unix))'.dependencies]
# Timeline identities use OS randomness on Windows as well (already locked).
getrandom = "0.4"
