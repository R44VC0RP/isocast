# The setup scripts/ui-screenshots.sh draws the app against: synthetic
# sources only (no permissions, no devices), so every Mac gets the same
# pictures. Paths are relative to this file.

version = 1
name = "Weekly Stream"

[canvas]
width = 1920
height = 1080
fps = 30

[recording]
folder = "recordings"
program = { encoder = { codec = "hevc" }, audio = ["mic"] }
iso = { enabled = true, sources = ["camera", "slides"], audio = ["mic"] }

[[sources]]
id = "camera"
name = "Camera"
kind = "test_pattern"

[[sources]]
id = "slides"
name = "Slides"
kind = "image"
path = "landscape.jpg"

[[sources]]
id = "brb-art"
name = "BRB Art"
kind = "image"
path = "brb.jpg"

[[sources]]
id = "mic"
name = "Mic"
kind = "tone"
frequency = 440

[[scenes]]
id = "main"
name = "Main"

[[scenes.items]]
source = "slides"
rect = { x = 0, y = 0, width = 1920, height = 1080 }
fit = "cover"

[[scenes.items]]
id = "camera-inset"
source = "camera"
rect = { x = 1392, y = 704, width = 480, height = 270 }
style = { radius = 18 }

[[scenes.items]]
id = "lower-third"
rect = { x = 48, y = 900, width = 760, height = 104 }
style = { background = "#101418e6", radius = 14 }

[[scenes.items.children]]
id = "lower-third-title"
rect = { x = 28, y = 14, width = 700, height = 44 }
content = { kind = "text", text = "Building a recorder in Rust", size = 36, weight = 600 }

[[scenes.items.children]]
id = "lower-third-sub"
rect = { x = 28, y = 60, width = 700, height = 30 }
content = { kind = "text", text = "Episode 12 · scenes, ISO files and agents", size = 24, color = "#f2b84b" }

[[scenes]]
id = "intro"
name = "Intro"

[[scenes.items]]
source = "slides"
rect = { x = 0, y = 0, width = 1920, height = 1080 }
fit = "cover"

[[scenes.items]]
id = "intro-title"
rect = { x = 120, y = 380, width = 900, height = 120 }
content = { kind = "text", text = "Starting soon", size = 96, weight = 700 }

[[scenes]]
id = "brb"
name = "Be Right Back"

[[scenes.items]]
source = "brb-art"
rect = { x = 0, y = 0, width = 1920, height = 1080 }
fit = "cover"

[[scenes.items]]
id = "brb-title"
rect = { x = 120, y = 440, width = 900, height = 120 }
content = { kind = "text", text = "Be right back", size = 96, weight = 700 }
