# The editor window's drags (#87; docs/motion-testing.md). Each run first
# records two takes of scripts/motion/setup.toml's synthetic sources onto
# a new timeline, trimmed to exactly 3 s and 2 s, with only the block's ISO
# file and the tone muted, so every run draws the same pixels (#94; CI runs
# this suite in lockstep), and opens the editor on them (the harness does
# this for every `editor-…` target), then replays the drag into the editor
# window. Snapping is turned off (N) so the edge follows the
# pointer exactly; the playhead and trims snapping is checked offscreen.

[defaults]
size = "1280x800"
scale = 1
fps = 60
picture = "test"
clock = "realtime"
variants = ["idle"]

[defaults.thresholds]
gap_pt_p95 = 2.0
lag_frames = 1
gain_tolerance = 0.1
jump_back_frames = 0
stall_frames = 2
black_frames = 0
flicker_frames = 0
frame_ms_max = 16.7

# The first clip's out point, 120 pt in and 100 back (a ripple trim on
# release).
[[scenario]]
name = "editor-trim"
description = "Drag the first clip's out point left 120 pt and back 100"
target = "editor-trim"
# Selected, so its ring marks its edge in the pixels.
before = ["create-key:snap", "create-select:0"]
steps = [
  { press = "target", ms = 50 },
  { move = [-120, 0], ms = 600, easing = "ease-in-out" },
  { move = [100, 0], ms = 500, easing = "ease-in-out" },
  { release = true, ms = 100 },
]

# Scrubbing: the playhead dragged along the ruler (the viewer follows).
[[scenario]]
name = "editor-playhead"
description = "Drag the playhead along the ruler 200 pt right and 150 back"
target = "editor-playhead"
before = ["create-key:snap"]
steps = [
  { press = "target", ms = 50 },
  { move = [200, 0], ms = 700, easing = "ease-in-out" },
  { move = [-150, 0], ms = 600, easing = "ease-in-out" },
  { release = true, ms = 100 },
]

# The crop box's bottom-right corner, free shape.
[[scenario]]
name = "editor-crop"
description = "Drag the crop's bottom-right corner in 160x90 pt and out 80x45"
target = "editor-crop"
before = ["create-crop-mode:on"]
steps = [
  { press = "target", ms = 50 },
  { move = [-160, -90], ms = 700, easing = "ease-in-out" },
  { move = [80, 45], ms = 500, easing = "ease-in-out" },
  { release = true, ms = 100 },
]
