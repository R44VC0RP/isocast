# The example's two audio filters, each a WebAssembly component built from
# Rust for wasm32-wasip2 by ./build.sh. Not part of Isocast's workspace.
[workspace]
members = ["gain", "ducker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Without std: an Isocast component gets no WASI, so nothing may import it.
wit-bindgen = { version = "0.57.1", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
